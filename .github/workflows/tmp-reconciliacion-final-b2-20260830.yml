name: Reconciliación temporal final B2

on:
  push:
    branches:
      - fix/reconciliacion-final-b2-lector-20260830
    paths:
      - ".github/workflows/tmp-reconciliacion-final-b2-20260830.yml"

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reconciliacion-final-b2-lector-20260830
          fetch-depth: 0

      - name: Reconciliar documentos y manifiesto
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re, html

          ROOT = Path('.')
          REALIZATION = 'c1acf943a7a44ce81080881e59283de8a2019606'
          QUALITY = '8248ec5c2c90e39e5b3798205090facc402d2a88'
          CLOSURE = 'ACTA_TECNICA_DE_CONFORMIDAD_CIERRE_CORRECTIVO_B2_Y_RESTAURACION_CONTINUIDAD_2026_08_29.md'
          BLOCK = 'ACTA_TECNICA_DE_ENCARGO_CORRECTIVO_INCIDENTAL_HUECOS_HEREDADOS_BETA_2_Y_BLOQUEO_R2_2026_08_29.md'

          def load(path):
              return Path(path).read_text(encoding='utf-8')

          def save(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: se esperaba 1 coincidencia y hay {count}')
              return text.replace(old, new, 1)

          es_histories = [
              'docs/candidata-integracion/historial-beta.html',
              'docs/beta-publica/historial-beta.html',
          ]
          en_histories = [
              'docs/candidata-integracion/beta-history.html',
              'docs/beta-publica/beta-history.html',
          ]

          for path in es_histories:
              t = load(path)
              t = replace_once(
                  t,
                  '<tr><th>Estado</th><td><span class="status-badge">Incorporada técnicamente · cierre registral de Calidad pendiente</span></td></tr>',
                  '<tr><th>Estado</th><td><span class="status-badge">Incorporada · cierre interno de Calidad registrado · verificación independiente final pendiente</span></td></tr>',
                  path + ' estado'
              )
              t = replace_once(
                  t,
                  '<tr><th>Corte estable publicado tras ajustes finales</th><td><code>e1d1d33af497e800adaa9a7dcc6ebc6f18b838b5</code></td></tr>',
                  '<tr><th>Corte estable publicado tras ajustes de presentación</th><td><code>e1d1d33af497e800adaa9a7dcc6ebc6f18b838b5</code></td></tr>\n        <tr><th>Corte de realización estable corregida</th><td><code>' + REALIZATION + '</code></td></tr>\n        <tr><th>Corte de cierre interno de Calidad</th><td><code>' + QUALITY + '</code></td></tr>',
                  path + ' cortes'
              )
              old = '''      <h3>Deuda heredada no atribuible a B2</h3>\n      <p>La incorporación de B2 no resuelve la deuda gramatical heredada registrada como <code>DFL-007</code>. Esa deuda afecta al frente soberano del Lenguaje y mantiene suspendida la continuidad de R2 hasta su resolución y recertificación correspondiente.</p>\n      <p><a class="inline-link" href="https://lectura-sv.itvia.online/lenguaje/?file=docs/calidad/REGISTRO_DEUDA_VIVA_DEL_FRENTE_FINAL_DEL_LENGUAJE_SV.md">Abrir registro público de deuda viva</a></p>'''
              new = '''      <h3>Deuda heredada y cierre posterior</h3>\n      <p>La incorporación inicial de B2 no resolvía por sí sola la deuda gramatical heredada <code>DFL-007</code>. Posteriormente, DG-01, DG-02 y DG-03 fueron corregidos sobre la identidad canónica común en la realización estable <code>''' + REALIZATION + '''</code>; el cierre interno de Calidad quedó registrado en <code>''' + QUALITY + '''</code>. R0 quedó nuevamente cerrado en el perímetro afectado, R1 fue revalidado y R2 recuperó su estado abierto previo.</p>\n      <p>El cierre de <code>DFL-007</code> no materializa <code>ConflictOperator</code> ni completa J2.3 para concurrencia en régimen <code>General</code>; esa deuda permanece separada.</p>\n      <p><a class="inline-link" href="https://lectura-sv.itvia.online/lenguaje/?file=docs/calidad/''' + CLOSURE + '''">Abrir acta pública de cierre de conformidad</a> · <a class="inline-link" href="https://lectura-sv.itvia.online/lenguaje/?file=docs/calidad/REGISTRO_DEUDA_VIVA_DEL_FRENTE_FINAL_DEL_LENGUAJE_SV.md">Abrir registro público de deuda viva</a></p>'''
              t = replace_once(t, old, new, path + ' deuda')
              t = replace_once(
                  t,
                  '<p>Beta B2 queda como antecedente experimental de la realización estable incorporada el 29 de agosto de 2026. Las Betas posteriores deberán conservar identidad propia, evidencia reproducible, límites explícitos y relación trazable con cualquier incorporación estable futura.</p>',
                  '<p>Beta B2 queda como antecedente experimental de la realización estable incorporada el 29 de agosto de 2026. Tras el cierre correctivo de DFL-007, R0 permanece cerrado, R1 cerrado y revalidado, y R2 abierto dentro de su alcance propio. Las Betas posteriores deberán conservar identidad propia, evidencia reproducible, límites explícitos y relación trazable con cualquier incorporación estable futura.</p>',
                  path + ' continuidad'
              )
              save(path, t)

          for path in en_histories:
              t = load(path)
              t = replace_once(
                  t,
                  '<tr><th>Status</th><td><span class="status-badge">Technically incorporated · Quality record closure pending</span></td></tr>',
                  '<tr><th>Status</th><td><span class="status-badge">Incorporated · internal Quality closure recorded · final independent verification pending</span></td></tr>',
                  path + ' status'
              )
              t = replace_once(
                  t,
                  '<tr><th>Stable cut published after presentation adjustments</th><td><code>e1d1d33af497e800adaa9a7dcc6ebc6f18b838b5</code></td></tr>',
                  '<tr><th>Stable cut published after presentation adjustments</th><td><code>e1d1d33af497e800adaa9a7dcc6ebc6f18b838b5</code></td></tr>\n        <tr><th>Corrected stable-realization cut</th><td><code>' + REALIZATION + '</code></td></tr>\n        <tr><th>Internal Quality-closure cut</th><td><code>' + QUALITY + '</code></td></tr>',
                  path + ' cuts'
              )
              old = '''      <h3>Inherited debt not attributable to B2</h3>\n      <p>B2 incorporation does not by itself resolve the inherited grammatical debt recorded as <code>DFL-007</code>. That debt belongs to the sovereign Language front and keeps R2 continuity suspended until its correction and corresponding recertification.</p>\n      <p><a class="inline-link" href="https://lectura-sv.itvia.online/lenguaje/?file=docs/calidad/REGISTRO_DEUDA_VIVA_DEL_FRENTE_FINAL_DEL_LENGUAJE_SV.md">Open the public live-debt register</a></p>'''
              new = '''      <h3>Inherited debt and subsequent closure</h3>\n      <p>The initial incorporation of B2 did not by itself resolve the inherited grammatical debt <code>DFL-007</code>. DG-01, DG-02 and DG-03 were subsequently corrected over the common canonical identity in stable realization <code>''' + REALIZATION + '''</code>; the internal Quality closure was recorded in <code>''' + QUALITY + '''</code>. R0 was re-closed in the affected perimeter, R1 was revalidated, and R2 returned to its previously open state.</p>\n      <p>Closing <code>DFL-007</code> does not materialize <code>ConflictOperator</code> or complete J2.3 for concurrency under <code>General</code>; that debt remains separate.</p>\n      <p><a class="inline-link" href="https://lectura-sv.itvia.online/lenguaje/?file=docs/calidad/''' + CLOSURE + '''">Open the public conformity-closure record</a> · <a class="inline-link" href="https://lectura-sv.itvia.online/lenguaje/?file=docs/calidad/REGISTRO_DEUDA_VIVA_DEL_FRENTE_FINAL_DEL_LENGUAJE_SV.md">Open the public live-debt register</a></p>'''
              t = replace_once(t, old, new, path + ' debt')
              t = replace_once(
                  t,
                  '<p>Beta B2 remains the experimental antecedent of the stable realization incorporated on 29 August 2026. Later Betas must retain their own identity, reproducible evidence, explicit limits and a traceable relation with any future stable incorporation.</p>',
                  '<p>Beta B2 remains the experimental antecedent of the stable realization incorporated on 29 August 2026. After corrective closure of DFL-007, R0 remains closed, R1 closed and revalidated, and R2 open within its own scope. Later Betas must retain their own identity, reproducible evidence, explicit limits and a traceable relation with any future stable incorporation.</p>',
                  path + ' continuity'
              )
              save(path, t)

          # Características / Features
          feature_paths = [
              ('docs/candidata-integracion/caracteristicas.html', 'es'),
              ('docs/candidata-integracion/features.html', 'en'),
          ]
          for path, lang in feature_paths:
              t = load(path)
              if lang == 'es':
                  t = replace_once(
                      t,
                      'Los diez criterios técnicos comprobados de R1 conservaron sus resultados dentro del alcance ensayado; su eficacia de continuidad permanece subordinada al estado de R0 y no habilita R2 mientras exista una deuda bloqueante.',
                      'Los diez criterios técnicos comprobados de R1 conservaron sus resultados dentro del alcance ensayado. Tras el cierre correctivo de DFL-007, R1 quedó revalidado sobre la base R0 corregida y R2 recuperó su estado abierto; esta situación no constituye cierre de R2.',
                      path + ' R1/R2'
                  )
                  t = replace_once(
                      t,
                      BLOCK,
                      CLOSURE,
                      path + ' enlace acta'
                  )
                  t = t.replace('Acta de Calidad sobre huecos heredados y bloqueo de R2.', 'Acta de Calidad de cierre correctivo B2 y restauración de continuidad.')
              else:
                  t = replace_once(
                      t,
                      'The ten technically exercised R1 criteria retained their results within the tested scope; their continuity effect remains subordinate to the state of R0 and does not enable R2 while a blocking debt exists.',
                      'The ten technically exercised R1 criteria retained their results within the tested scope. After corrective closure of DFL-007, R1 was revalidated on the corrected R0 basis and R2 returned to its open state; this does not constitute closure of R2.',
                      path + ' R1/R2'
                  )
                  t = replace_once(t, BLOCK, CLOSURE, path + ' closure link')
                  t = t.replace('Quality record on inherited gaps and the R2 block.', 'Quality record for the corrective B2 closure and restoration of continuity.')
              save(path, t)

          # Seguridad / Security: sólo referencia vigente de Calidad; límites permanecen.
          for path in ['docs/candidata-integracion/seguridad-b2.html','docs/candidata-integracion/security-b2.html']:
              t = load(path)
              t = replace_once(t, BLOCK, CLOSURE, path + ' closure link')
              if path.endswith('seguridad-b2.html'):
                  t = t.replace('Registro de Calidad aplicable.', 'Acta de Calidad de cierre correctivo B2 y restauración de continuidad.')
              else:
                  t = t.replace('Applicable Quality record.', 'Quality record for the corrective B2 closure and restoration of continuity.')
              save(path, t)

          # Manifiesto: conservar las identidades históricas y tipar los cortes soberanos.
          manifest_path = Path('docs/candidata-integracion/build-info.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['source_commit_role'] = 'certified_b2_functional_cut'
          manifest['public_distribution_commit_role'] = 'SVcustos Beta B2 public distribution'
          manifest['stable_realization_commit'] = REALIZATION
          manifest['quality_closure_commit'] = QUALITY
          manifest['quality_register_entry'] = 'RETP-2026-071'
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # Interfaz: la procedencia visible principal debe ser el corte estable, no el campo histórico ambiguo.
          app_path = 'docs/candidata-integracion/app-b2.js'
          t = load(app_path)
          t = replace_once(t, 'betaVersion: "Procedencia",', 'betaVersion: "Corte estable",', app_path + ' label ES')
          t = replace_once(t, 'betaVersion: "Provenance",', 'betaVersion: "Stable cut",', app_path + ' label EN')
          t = replace_once(
              t,
              'if (el.buildSourceCommit) el.buildSourceCommit.textContent = state.build.source_commit ?? "—";',
              'if (el.buildSourceCommit) el.buildSourceCommit.textContent = state.build.stable_realization_commit ?? state.build.source_commit ?? "—";',
              app_path + ' stable commit'
          )
          save(app_path, t)

          # Acta: separar materialmente realización y cierre documental y precisar VH-01.
          acta_path = 'docs/calidad/' + CLOSURE
          t = load(acta_path)
          t = replace_once(
              t,
              '''La corrección funcional y su distribución estable quedan integradas en el corte soberano:\n\n```text\nmain de realización = c1acf943a7a44ce81080881e59283de8a2019606\n```''',
              '''La corrección funcional y su distribución estable quedan integradas en el corte de realización:\n\n```text\nrealización estable = c1acf943a7a44ce81080881e59283de8a2019606\n```\n\nEl cierre documental y registral posterior queda constituido en un corte distinto:\n\n```text\ncierre interno de Calidad = 8248ec5c2c90e39e5b3798205090facc402d2a88\n```\n\nAmbos identificadores cumplen funciones distintas: el primero identifica la realización que produce el WebAssembly corregido; el segundo incorpora las reconciliaciones documentales y registrales posteriores. No se exige que una corrección exclusivamente documental altere o reconstruya el WebAssembly ya acreditado.''',
              acta_path + ' cortes'
          )
          t = replace_once(
              t,
              '''El archivo anteriormente denominado `tests/adversarial/deep_nested_query_valid.svp` deja de presentarse como programa válido de la gramática actual.\n\nSu contenido histórico se conserva en:\n\n```text\ntests/adversarial/historico/deep_nested_query_legacy_gramatica_0_1.svp\n```\n\ncon indicación expresa de que corresponde a Gramática 0.1 y no es válido bajo Gramática 0.2.''',
              '''El archivo anteriormente denominado `tests/adversarial/deep_nested_query_valid.svp` deja de presentarse como programa válido de la gramática actual en el corte documental de cierre.\n\nSu contenido histórico se conserva en:\n\n```text\ntests/adversarial/historico/deep_nested_query_legacy_gramatica_0_1.svp\n```\n\ncon indicación expresa de que corresponde a Gramática 0.1 y no es válido bajo Gramática 0.2. Esta reclasificación es registral y posterior al corte de realización `c1acf943a7a44ce81080881e59283de8a2019606`; el vector no forma parte del módulo WebAssembly ni condiciona su identidad material.''',
              acta_path + ' VH-01'
          )
          marker = '## 12. Dictamen\n'
          if marker not in t:
              raise SystemExit('acta: no se encuentra Dictamen')
          registry = '''## 12. Registro de evolución\n\nEl hito consolidado de este ciclo se registra como `RETP-2026-071` en `REGISTRO_EVOLUCION_TECNICA_PROYECTO.md` y en su CSV maestro. No se crea un asiento independiente para cada corrección de la misma operación material.\n\n'''
          t = t.replace(marker, registry + '## 13. Dictamen\n', 1)
          save(acta_path, t)

          # Historial general: retirar la defensa HTML de presentación y volver a tablas Markdown limpias.
          history_path = Path('docs/calidad/HISTORIAL_VERSIONES_LENGUAJE_SV.md')
          text = history_path.read_text(encoding='utf-8')

          def inline_md(value):
              value = re.sub(r'<a href="([^"]+)">(.*?)</a>', lambda m: '[' + inline_md(m.group(2)) + '](' + m.group(1) + ')', value, flags=re.S)
              value = re.sub(r'<code>(.*?)</code>', lambda m: '`' + html.unescape(re.sub(r'<[^>]+>', '', m.group(1))) + '`', value, flags=re.S)
              value = re.sub(r'<strong>(.*?)</strong>', lambda m: '**' + inline_md(m.group(1)) + '**', value, flags=re.S)
              value = re.sub(r'<br\s*/?>', ' ', value, flags=re.I)
              value = re.sub(r'<[^>]+>', '', value)
              value = html.unescape(value)
              value = re.sub(r'\s+', ' ', value).strip()
              return value.replace('|', '\\|')

          table_pattern = re.compile(r'<div style="overflow-x:auto;[^>]*>\s*<table[^>]*>(.*?)</table>\s*</div>', re.S)
          matches = list(table_pattern.finditer(text))
          if len(matches) != 2:
              raise SystemExit(f'historial: se esperaban 2 tablas HTML defensivas y hay {len(matches)}')

          def table_to_md(table_html):
              rows = []
              for row_html in re.findall(r'<tr>(.*?)</tr>', table_html, flags=re.S):
                  cells = re.findall(r'<t[hd][^>]*>(.*?)</t[hd]>', row_html, flags=re.S)
                  if cells:
                      rows.append([inline_md(c) for c in cells])
              if len(rows) < 2:
                  raise SystemExit('historial: tabla sin filas suficientes')
              width = len(rows[0])
              if any(len(r) != width for r in rows):
                  raise SystemExit('historial: tabla irregular')
              out = ['| ' + ' | '.join(rows[0]) + ' |', '| ' + ' | '.join(['---'] * width) + ' |']
              out += ['| ' + ' | '.join(r) + ' |' for r in rows[1:]]
              return '\n'.join(out)

          # reemplazar de atrás hacia delante para conservar offsets
          for m in reversed(matches):
              replacement = table_to_md(m.group(1))
              text = text[:m.start()] + replacement + text[m.end():]
          history_path.write_text(text, encoding='utf-8')
          PY

      - name: Comprobar alcance
        run: |
          set -euo pipefail
          python -m json.tool docs/candidata-integracion/build-info.json >/dev/null
          grep -q '"stable_realization_commit": "c1acf943a7a44ce81080881e59283de8a2019606"' docs/candidata-integracion/build-info.json
          grep -q '"quality_closure_commit": "8248ec5c2c90e39e5b3798205090facc402d2a88"' docs/candidata-integracion/build-info.json
          grep -q 'R2 recuperó su estado abierto' docs/candidata-integracion/historial-beta.html
          grep -q 'R2 returned to its open state' docs/candidata-integracion/beta-history.html
          grep -q 'ACTA_TECNICA_DE_CONFORMIDAD_CIERRE_CORRECTIVO_B2_Y_RESTAURACION_CONTINUIDAD_2026_08_29.md' docs/candidata-integracion/caracteristicas.html
          grep -q 'ACTA_TECNICA_DE_CONFORMIDAD_CIERRE_CORRECTIVO_B2_Y_RESTAURACION_CONTINUIDAD_2026_08_29.md' docs/candidata-integracion/security-b2.html
          ! grep -q '<div style="overflow-x:auto' docs/calidad/HISTORIAL_VERSIONES_LENGUAJE_SV.md
          grep -q '| Fecha | Situación actual | Gramática | IR | Serializador | Realización o entorno | Modificación material | Evidencia pública |' docs/calidad/HISTORIAL_VERSIONES_LENGUAJE_SV.md
          grep -q 'RETP-2026-071' docs/calidad/ACTA_TECNICA_DE_CONFORMIDAD_CIERRE_CORRECTIVO_B2_Y_RESTAURACION_CONTINUIDAD_2026_08_29.md
          test "$(find docs/candidata-integracion -type f -name 'wasm-b2' | wc -l)" = 0
          git diff --check

      - name: Registrar reconciliación
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/candidata-integracion \
            docs/beta-publica/historial-beta.html \
            docs/beta-publica/beta-history.html \
            docs/calidad/HISTORIAL_VERSIONES_LENGUAJE_SV.md \
            docs/calidad/ACTA_TECNICA_DE_CONFORMIDAD_CIERRE_CORRECTIVO_B2_Y_RESTAURACION_CONTINUIDAD_2026_08_29.md
          git commit -m "Reconcilia publicación B2 con el cierre de Calidad"
          git push origin HEAD:fix/reconciliacion-final-b2-lector-20260830
