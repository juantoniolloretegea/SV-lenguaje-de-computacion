name: "Finalización visual de producción"

on:
  push:
    branches:
      - integracion-beta2-candidata-produccion-2026-08-29
    paths:
      - .github/workflows/finaliza-ui-produccion.yml

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integracion-beta2-candidata-produccion-2026-08-29
          fetch-depth: 0

      - name: Verificar fragmentos y reconstruir paquete exacto
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, io, zipfile

          expected_parts = {
              '.tmp/final-ui-part-0.b64': 'bc15dd9db0e9bf72d099106c9cf2baa85085c66d13d76fe41684ac08ebda2609',
              '.tmp/final-ui-part-1.b64': 'b0f5cf47b59a2b9ee78c53d1262839b9486720fa1e60c933b6e0ea8ab2cd2149',
              '.tmp/final-ui-part-2a.b64': 'e980e00bac01c3c35955fb9ec6fb5c1da8cbfbeb6701cfb143cb11255eca26eb',
              '.tmp/final-ui-part-2b.b64': '84106dae9b415eeb5e730991a852656f488bb89d5f28eaa01fcfab485c8e9900',
              '.tmp/final-ui-part-2c.b64': 'cf6f26d79dc25dd73cf08da8085a3464dccdb4ca85811241367355f7136e56ee',
              '.tmp/final-ui-part-3a.b64': '8c384f7724dd3fe8ad8f9aeb50a20d2290f1bbf37a3a267080a8645f827f2c64',
              '.tmp/final-ui-part-3b.b64': 'c894b752d0ceb8e68660c681ed4fae88f93c8116e02d853698023289f0b92620',
              '.tmp/final-ui-part-3c.b64': '41c268a1b3ce69339c060ad64790a43832b14f69ac228777a29c69be4e4b67eb',
          }
          normalized = []
          for path, expected in expected_parts.items():
              text = ''.join(Path(path).read_text(encoding='utf-8').split())
              actual = hashlib.sha256(text.encode()).hexdigest()
              print(f'{path} LEN={len(text)} SHA256={actual}')
              assert actual == expected, (path, actual, expected)
              normalized.append(text)

          encoded = ''.join(normalized)
          assert len(encoded) == 47872, len(encoded)
          payload = base64.b64decode(encoded, validate=True)
          expected_zip = '680677b28d47478d8a46a7faff5c40c9e5d3460abe6496e277823f0cf1ec7a01'
          actual_zip = hashlib.sha256(payload).hexdigest()
          assert len(payload) == 35903, len(payload)
          assert actual_zip == expected_zip, (actual_zip, expected_zip)

          target = Path('docs/candidata-integracion')
          allowed = {
            'index.html','styles.css','b2.css','app-b2.js','i18n-static-b2.js',
            'build-info.json','origen-beta2.json','caracteristicas.html','features.html',
            'diagnosticos.html','diagnostics.html','seguridad-b2.html','security-b2.html',
            'programacion-metricas.html','programming-metrics.html'
          }
          with zipfile.ZipFile(io.BytesIO(payload)) as z:
              names = set(z.namelist())
              assert names == allowed, (names - allowed, allowed - names)
              for name in sorted(names):
                  (target / name).write_bytes(z.read(name))
          print('ZIP_SHA256=' + actual_zip)
          PY

      - name: Verificar identidad exacta y residuos
        shell: bash
        run: |
          set -euo pipefail
          cd docs/candidata-integracion
          cat > /tmp/final.sha256 <<'EOF'
          6ad85907c9e277c5587d5892f09752fa04c41eb13d96fd28b1effca1005bfaf0  index.html
          fdc43e937c90413a6af237146f921cd865ca5b4c942c02f8c0f3f7023be0e131  styles.css
          2269c276f670683d886a2c11235ff1a20edfe5dc1bde2a0ada39747ae064d263  b2.css
          8219acaf7c8cf4b0a63130bc1060f66e1c7b5b4fd8c62b7023cbe941a33e147a  app-b2.js
          cbe7e0986dfec24a585de67ef86213e9d50b86758f8116c0a0f4852a9310698d  i18n-static-b2.js
          7dc20dca7bb825f0c3096bd78d8ff5784a8cf9692cd47ac7406b341a470c8119  build-info.json
          7b924a5e2640b39f4add0c5a8908603c6a5da955f06ff9a8156544814310af21  origen-beta2.json
          6c9b82c4cfb8cb8967ff14384f69da9517c5ce98a51a06cc911add9641f12179  caracteristicas.html
          55a568f45673f929414d3535dfc40225555406254549c842776aa1405d6a0915  features.html
          e0c6ea9549bb10ce82861c129f29e32122adfd95ab34dde784f67a9171cfaad4  diagnosticos.html
          fee1a1d5ad0ef3ca391d0f5708f9ebff6adc3f63e695e099b316eb4bfde5f96f  diagnostics.html
          c999967dd88b9730f86629f1873409209a0f764b2e494f4bd33d6a28f988f67a  seguridad-b2.html
          30eb41a7cf305a17ac0a892c491e2500394cbeb2e016fce2aedd226fc3170628  security-b2.html
          3319367756347819fe7ba23d9acdfc862fc7ecce90f7690bdb27a48f97074fdf  programacion-metricas.html
          5d61ebb1997627ccd208dea7e812fe14ec87af99fff34f9912f8858de5785c21  programming-metrics.html
          EOF
          sha256sum -c /tmp/final.sha256
          node --check app-b2.js
          node --check i18n-static-b2.js
          ! grep -RniE 'candidata|candidate|pending_quality|candidate_not|pre-public|prepublic' -- *.html *.js *.json
          test "$(grep -o 'id="diagnostics-link"' index.html | wc -l)" -eq 1
          ! grep -q '>Versión publicada<' index.html
          ! grep -q 'class="build-panel' index.html
          grep -q -- '--profile: #0b57d0;' styles.css
          grep -q '"status": "production"' build-info.json
          grep -q '"promotion_status": "authorized_for_production"' build-info.json

      - name: Verificar enlaces relativos y estructura HTML
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlsplit

          root = Path('docs/candidata-integracion')
          pages = sorted(root.glob('*.html'))
          failures = []
          for page in pages:
              class P(HTMLParser):
                  def __init__(self):
                      super().__init__(); self.hrefs=[]; self.ids=[]
                  def handle_starttag(self, tag, attrs):
                      a=dict(attrs)
                      if 'id' in a: self.ids.append(a['id'])
                      if tag == 'a' and 'href' in a: self.hrefs.append(a['href'])
              p=P(); p.feed(page.read_text(encoding='utf-8'))
              if len(p.ids) != len(set(p.ids)):
                  failures.append(f'{page.name}: identificadores HTML duplicados')
              for href in p.hrefs:
                  u=urlsplit(href)
                  if u.scheme or u.netloc or href.startswith('#') or href.startswith('mailto:'):
                      continue
                  rel=u.path
                  if rel in ('', './'):
                      dest=root/'index.html'
                  else:
                      dest=(page.parent/rel)
                      if dest.is_dir(): dest=dest/'index.html'
                  if not dest.exists():
                      failures.append(f'{page.name}: destino relativo inexistente: {href}')
          if failures:
              raise SystemExit('\n'.join(failures))
          print(f'HTML_PAGES={len(pages)} RELATIVE_LINKS=PASS DUPLICATE_IDS=PASS')
          PY

      - name: Confirmar radio de cambios
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only HEAD -- docs/candidata-integracion | sort | tee /tmp/changed.txt
          test "$(wc -l < /tmp/changed.txt)" -eq 15

      - name: Retirar mecanismos temporales y fijar resultado
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Juan Antonio Lloret Egea"
          git config user.email "111652409+juantoniolloretegea@users.noreply.github.com"
          git add docs/candidata-integracion
          git rm -f \
            .tmp/final-ui.b64 \
            .tmp/final-ui-part-0.b64 \
            .tmp/final-ui-part-1.b64 \
            .tmp/final-ui-part-2.b64 \
            .tmp/final-ui-part-2a.b64 \
            .tmp/final-ui-part-2b.b64 \
            .tmp/final-ui-part-2c.b64 \
            .tmp/final-ui-part-3a.b64 \
            .tmp/final-ui-part-3b.b64 \
            .tmp/final-ui-part-3c.b64 \
            .github/workflows/finaliza-ui-produccion.yml
          git commit -m "producción: aplica ajustes finales autorizados y retira útiles temporales"
          git push origin HEAD:integracion-beta2-candidata-produccion-2026-08-29
