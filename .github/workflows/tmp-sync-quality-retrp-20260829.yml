name: Sincronización temporal del registro consolidado B2

on:
  push:
    branches:
      - quality/cierre-b2-conformidad-20260829
    paths:
      - ".github/workflows/tmp-sync-quality-retrp-20260829.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Obtener rama de Calidad
        uses: actions/checkout@v4
        with:
          ref: quality/cierre-b2-conformidad-20260829
          fetch-depth: 0

      - name: Sincronizar RETP 069-071
        run: |
          python - <<'PY'
          from pathlib import Path
          import csv

          root = Path('docs/calidad')
          csv_path = root / 'REGISTRO_EVOLUCION_TECNICA_PROYECTO.csv'
          md_path = root / 'REGISTRO_EVOLUCION_TECNICA_PROYECTO.md'

          fields = [
              'ID','Fecha','Hora_Europe_Madrid','Tipo_Hito','Frente_Fase',
              'Resumen_Cambio','Motivo_Argumento','Base_Doctrinal_Tecnica',
              'Artefactos_Afectados','Evidencia','Impacto','Objecion_Adversarial',
              'Decision','Estado'
          ]

          with csv_path.open('r', encoding='utf-8', newline='') as f:
              rows = list(csv.DictReader(f))
          ids = {row['ID'] for row in rows}

          additions = [
              {
                  'ID':'RETP-2026-069','Fecha':'20/08/2026','Hora_Europe_Madrid':'07:23:44',
                  'Tipo_Hito':'APERTURA_BLOQUE_Y_PREPARACION_PROBATORIA',
                  'Frente_Fase':'Lenguaje SV / FFL-C / pruebas y evidencia',
                  'Resumen_Cambio':'Se abre FFL-C para comprobar la suficiencia de la evidencia reproducible, con escritura funcional limitada a tests/ y lectura sobre la implementación y la especificación.',
                  'Motivo_Argumento':'FFL-B estaba cerrado y el tablero exigía una decisión expresa antes de activar el bloque de pruebas y evidencia.',
                  'Base_Doctrinal_Tecnica':'Cierre de FFL-B; matriz diagnóstica; batería de conformidad; reglas de continuidad del frente final.',
                  'Artefactos_Afectados':'tests/; tests/COBERTURA_OBSERVABLE_FFL_C_2026_08_20.md; documentación de Calidad asociada.',
                  'Evidencia':'commit 910af1dd0c7ba1f811f4b77a7872626e1c3e695d; caso SystemTarget(CompositionGraph) en a0af722b0ba51cabd5d5fea9c7d719d3ba775e5d; caracterización E006 en 1e7ffa795fe0528888834dd35d09c321cb00c9f3; inventario 3d48c422915b0e0bed65ba2e7ce8b807d7a94c33.',
                  'Impacto':'trazabilidad; cobertura; suficiencia_probatoria.',
                  'Objecion_Adversarial':'Riesgo de ampliar el lenguaje para fabricar cobertura o de confundir ausencia de caso con ausencia de propiedad.',
                  'Decision':'Persistir únicamente comprobaciones que acrediten afirmaciones técnicas ya existentes y clasificar las ausencias de cobertura sin ampliar el lenguaje.',
                  'Estado':'cerrado'
              },
              {
                  'ID':'RETP-2026-070','Fecha':'20/08/2026','Hora_Europe_Madrid':'08:16:26',
                  'Tipo_Hito':'CIERRE_BLOQUE_Y_SINCRONIZACION_DE_EVIDENCIA',
                  'Frente_Fase':'Lenguaje SV / FFL-C / cierre probatorio',
                  'Resumen_Cambio':'Se cierra FFL-C tras una verificación independiente en modo de solo lectura y se sincroniza la evidencia de cobertura del corte.',
                  'Motivo_Argumento':'Las cuatro baterías del bloque concluyeron sin divergencias y el árbol permaneció sin cambios antes y después de la ejecución.',
                  'Base_Doctrinal_Tecnica':'Criterios de FFL-C; corpus de conformidad; contrato diagnóstico y clasificación de alcanzabilidad.',
                  'Artefactos_Afectados':'tests/; tests/COBERTURA_OBSERVABLE_FFL_C_2026_08_20.md; registros de Calidad.',
                  'Evidencia':'corte 3d48c422915b0e0bed65ba2e7ce8b807d7a94c33; conformidad 58/58; interfaz de línea de órdenes 3/3; SEC-0 3/3; caracterización E006 4/4; árbol limpio.',
                  'Impacto':'cierre_ffl_c; trazabilidad; evidencia_reproducible.',
                  'Objecion_Adversarial':'Riesgo de convertir cobertura parcial de diagnósticos en afirmación de exhaustividad o de materializar capacidades ausentes.',
                  'Decision':'Cerrar FFL-C dentro del alcance probado y mantener las capacidades no materializadas como deuda explícita.',
                  'Estado':'cerrado'
              },
              {
                  'ID':'RETP-2026-071','Fecha':'29/08/2026','Hora_Europe_Madrid':'NO_CONSTA',
                  'Tipo_Hito':'INTEGRACION_PUBLICACION_Y_CIERRE_DE_CONFORMIDAD',
                  'Frente_Fase':'Lenguaje SV / Beta B2 / realización estable bilingüe / cierre DFL-007',
                  'Resumen_Cambio':'Se integra y publica B2 como realización estable bilingüe SVP-ES/SVP-EN; se cierran DG-01/02/03 sobre identidad canónica, se constituyen normativamente los perfiles fuente, se corrige la navegación efectiva del Historial Beta, se reconcilian DD-01 y VH-01 y se restaura la continuidad R0-R2 afectada por DFL-007.',
                  'Motivo_Argumento':'La verificación ampliada de B2 descubrió huecos heredados de cierre gramatical y desajustes documentales que exigían corrección antes de proseguir R2, sin convertir cada paso mecánico de la misma operación en un hito registral independiente.',
                  'Base_Doctrinal_Tecnica':'Gramática canónica 0.2; IR 0.3; especificación normativa de perfiles fuente; encargo DFL-007; cierre técnico de R1; apertura de R2.',
                  'Artefactos_Afectados':'rust/sv_core; rust/sv_wasm; pruebas R0; ESPECIFICACION_NORMATIVA_PERFILES_FUENTE_SVP_ES_EN_v1_2026_08_29.md; GRAMATICA_SUPERFICIAL_MINIMA_SV_v0_2.md; entorno estable; README.md; historial, deuda y acta de Calidad.',
                  'Evidencia':'PR #55; main de realización c1acf943a7a44ce81080881e59283de8a2019606; WASM 378956 bytes SHA-256 95c7d1e0313567ef099c6e426a7fcee8ff4a5ac8adb670265f859f1bf03caab3; paquete 167503 bytes SHA-256 566200f97bfea86a0b7ce7c4919bac9d5367a67b8cba719eef1c573942d696f5; ejecuciones 33271992372, 33271992363, 33271992371 y 33271992457; comprobación material del Historial Beta; acta de conformidad de 29/08/2026.',
                  'Impacto':'conformidad_gramatical; bilingüismo_nativo; seguridad; trazabilidad; continuidad_r0_r1_r2; exactitud_documental.',
                  'Objecion_Adversarial':'Riesgo de confundir publicación con conformidad, perfil léxico con perfil fuente, cierre de DG-03 con materialización de J2.3-General o cierre de DFL-007 con cierre de R2.',
                  'Decision':'Cerrar DFL-007 sólo tras corrección, regresiones permanentes, reconciliación normativa y revalidación de R1; mantener J2.3-General como deuda separada, R2 abierto y las Garantías I/II en NO_PROBADO. Registrar todo el ciclo B2 como un único hito material.',
                  'Estado':'cerrado'
              }
          ]

          for item in additions:
              if item['ID'] not in ids:
                  rows.append(item)
                  ids.add(item['ID'])

          expected = {'RETP-2026-069','RETP-2026-070','RETP-2026-071'}
          if not expected.issubset(ids):
              raise SystemExit('faltan IDs RETP requeridos')
          if len([r for r in rows if r['ID']=='RETP-2026-071']) != 1:
              raise SystemExit('RETP-071 no es único')

          with csv_path.open('w', encoding='utf-8', newline='') as f:
              w = csv.DictWriter(f, fieldnames=fields, lineterminator='\n')
              w.writeheader()
              w.writerows(rows)

          text = md_path.read_text(encoding='utf-8')
          if 'RETP-2026-071 | 29/08/2026' not in text:
              table_anchor = '| RETP-2026-070 | 20/08/2026 | 08:16:26 | CIERRE_BLOQUE_Y_SINCRONIZACION_DE_EVIDENCIA | Lenguaje SV / FFL-C / cierre probatorio | cerrado |'
              if table_anchor not in text:
                  raise SystemExit('no se encuentra fila RETP-070 en la tabla')
              text = text.replace(table_anchor, table_anchor + '\n| RETP-2026-071 | 29/08/2026 | NO_CONSTA | INTEGRACION_PUBLICACION_Y_CIERRE_DE_CONFORMIDAD | Lenguaje SV / Beta B2 / realización estable bilingüe / cierre DFL-007 | cerrado |', 1)

              detail = '''### RETP-2026-071 — Integración, publicación y cierre de conformidad de B2\n\n- **Hecho:** B2 queda integrada y publicada como realización estable bilingüe `SVP-ES` / `SVP-EN`; se cierran los dominios gramaticales DG-01, DG-02 y DG-03 sobre identidad canónica, se constituye normativamente la capa de perfiles fuente, se corrige la navegación efectiva del Historial Beta y se completan las reconciliaciones DD-01 y VH-01 exigidas por DFL-007.\n- **Fundamento:** la verificación ampliada de B2 descubrió huecos heredados de conformidad gramatical y desajustes documentales que afectaban a una base previamente cerrada. El cierre exige corrección material, regresión permanente, reconciliación normativa y revalidación de dependencias, no la mera publicación del artefacto.\n- **Evidencia:** PR #55; corte de realización `c1acf943a7a44ce81080881e59283de8a2019606`; WebAssembly `378956` bytes, SHA-256 `95c7d1e0313567ef099c6e426a7fcee8ff4a5ac8adb670265f859f1bf03caab3`; paquete de despliegue `167503` bytes, SHA-256 `566200f97bfea86a0b7ce7c4919bac9d5367a67b8cba719eef1c573942d696f5`; conformidad 79/79; `sv_core` 210/210; dominios cerrados 5/5; seis sondas DG en navegador; `sv_wasm` 2/2; documentación ejecutable 17/17; comprobación material del Historial Beta; acta de conformidad de 29/08/2026.\n- **Decisión:** cerrar DFL-007, re-cerrar el perímetro R0 afectado, revalidar R1 y levantar únicamente la suspensión de R2 causada por esa deuda. R2 recupera su estado abierto previo.\n- **Límites:** `ConflictOperator` y J2.3 para concurrencia en régimen `General` permanecen abiertos; R2 no queda cerrado; R3 y R4 no se inician; Garantía I y Garantía II permanecen `NO_PROBADO`; la verificación externa independiente del corte final se registrará por separado.\n- **Criterio registral:** el ciclo B2 se registra como un único hito material; el detalle mecánico de sus correcciones permanece en Git y en la evidencia enlazada.\n- **Estado:** cerrado.\n\n'''
              marker = '## 4. Estado de continuidad\n'
              if marker not in text:
                  raise SystemExit('no se encuentra sección de continuidad')
              text = text.replace(marker, detail + marker, 1)

          start = text.index('## 4. Estado de continuidad')
          end = text.index('## 5. Numeración registral', start)
          continuity = '''## 4. Estado de continuidad\n\nFFL-A, FFL-B, FFL-C y FFL-E permanecen cerrados; FFL-D permanece pendiente dentro de su alcance propio.\n\nEl estado de realización posterior al cierre correctivo B2 es:\n\n```text\nR0 = CERRADO, incluido el perímetro correctivo de DFL-007\nR1 = CERRADO y revalidado sobre la base corregida\nR2 = ABIERTO; levantada la suspensión específica causada por DFL-007\nR3 = NO INICIADO\nR4 = NO INICIADO\n\nGarantía I  = NO_PROBADO\nGarantía II = NO_PROBADO\n```\n\nLa deuda técnica restante permanece registrada en `REGISTRO_DEUDA_VIVA_DEL_FRENTE_FINAL_DEL_LENGUAJE_SV.md`. El cierre de DFL-007 no materializa `ConflictOperator` ni completa J2.3 para concurrencia en régimen `General`. La verificación externa independiente del corte final permanece pendiente y se documentará separadamente.\n\n'''
          text = text[:start] + continuity + text[end:]
          md_path.write_text(text, encoding='utf-8')
          PY

      - name: Comprobar y registrar sincronización
        run: |
          set -euo pipefail
          grep -q '^RETP-2026-069,' docs/calidad/REGISTRO_EVOLUCION_TECNICA_PROYECTO.csv
          grep -q '^RETP-2026-070,' docs/calidad/REGISTRO_EVOLUCION_TECNICA_PROYECTO.csv
          test "$(grep -c '^RETP-2026-071,' docs/calidad/REGISTRO_EVOLUCION_TECNICA_PROYECTO.csv)" = "1"
          grep -q 'RETP-2026-071 — Integración, publicación y cierre de conformidad de B2' docs/calidad/REGISTRO_EVOLUCION_TECNICA_PROYECTO.md
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/calidad/REGISTRO_EVOLUCION_TECNICA_PROYECTO.md docs/calidad/REGISTRO_EVOLUCION_TECNICA_PROYECTO.csv
          git commit -m "Sincroniza el hito consolidado B2 en el registro de evolución"
          git push origin HEAD:quality/cierre-b2-conformidad-20260829
