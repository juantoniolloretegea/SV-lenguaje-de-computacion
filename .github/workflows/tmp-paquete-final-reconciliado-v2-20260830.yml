name: Paquete temporal final reconciliado B2 v2

on:
  push:
    branches:
      - fix/reconciliacion-final-b2-lector-20260830
    paths:
      - ".github/workflows/tmp-paquete-final-reconciliado-v2-20260830.yml"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reconciliacion-final-b2-lector-20260830
          fetch-depth: 0

      - name: Construir paquete estático exacto
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/package"
          rm -rf "$OUT"
          mkdir -p "$OUT/examples/en" "$OUT/examples/es" "$RUNNER_TEMP/out"

          files=(
            app-b2.js b2.css beta-history.html build-info.json caracteristicas.html
            diagnosticos.html diagnostics.html example-profile-sync-b2.js examples.json
            features.html historial-beta.html i18n-static-b2.js index.html info.css
            origen-beta2.json programacion-metricas.html programming-metrics.html
            security-b2.html seguridad-b2.html styles.css sv_wasm_b2.wasm.gz.b64
            workspace-b2.css workspace-b2.js
          )
          for f in "${files[@]}"; do cp "docs/candidata-integracion/$f" "$OUT/$f"; done
          cp docs/candidata-integracion/examples/en/*.svp "$OUT/examples/en/"
          cp docs/candidata-integracion/examples/es/*.svp "$OUT/examples/es/"

          cat > "$OUT/_headers" <<'EOF'
          /*
            Content-Security-Policy: default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; connect-src 'self'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'
            X-Content-Type-Options: nosniff
            X-Frame-Options: DENY
            Referrer-Policy: no-referrer
            Permissions-Policy: camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), hid=()
            Cross-Origin-Resource-Policy: same-origin
          EOF
          sed -i 's/^          //' "$OUT/_headers"
          printf 'User-agent: *\nAllow: /\n' > "$OUT/robots.txt"

          cat > "$OUT/DEPLOYMENT_SOURCE.txt" <<EOF
          SV Language public static deployment — reconciled B2 closure
          Repository: juantoniolloretegea/SV-lenguaje-de-computacion
          Final reconciliation: PR #57
          Static content source commit: ${GITHUB_SHA}
          Stable realization commit: c1acf943a7a44ce81080881e59283de8a2019606
          Internal Quality closure commit: 8248ec5c2c90e39e5b3798205090facc402d2a88
          Quality register entry: RETP-2026-071
          Certified B2 functional cut: 046adc6ad3f91183bde62afd99a20ff8f6eae4bb
          B2 production integration commit: 9b9c890a609839ad4b00fa71ded5e373ea354112
          Public Beta B2 distribution commit (SVcustos-dataset): ebe53b1faf3162f0e19b528e60d5fe859b1201ac
          Laboratory commit: fa43dc49adf9da8cff72d1a03c981c77d27ed93f
          WebAssembly evidence source head: 6c2fcc7f5a771eb0ce89acf959e2ad4ae1874750
          WebAssembly evidence run: 33271320776
          Closed-domain browser probes: 6/6
          WebAssembly bytes: 378956
          WebAssembly SHA-256: 95c7d1e0313567ef099c6e426a7fcee8ff4a5ac8adb670265f859f1bf03caab3
          Grammar: 0.2
          IR: 0.3
          Projection: 0.1.0
          Source profiles: SVP-ES, SVP-EN
          Distribution: single deterministic gzip/Base64 WebAssembly payload; no fetch interceptor or fragment reconstruction
          Reader Worker: separate deployment; not included in this package
          EOF
          sed -i 's/^          //' "$OUT/DEPLOYMENT_SOURCE.txt"

          ( cd "$OUT"; find . -type f ! -name SHA256SUMS.txt -printf '%P\0' | sort -z | xargs -0 sha256sum > SHA256SUMS.txt )

          python - <<'PY'
          from pathlib import Path
          import os, base64, gzip, hashlib, json, zipfile
          from html.parser import HTMLParser
          src=Path(os.environ['RUNNER_TEMP'])/'package'
          b64=(src/'sv_wasm_b2.wasm.gz.b64').read_text(encoding='ascii')
          wasm=gzip.decompress(base64.b64decode(''.join(b64.split())))
          assert len(wasm)==378956
          assert hashlib.sha256(wasm).hexdigest()=='95c7d1e0313567ef099c6e426a7fcee8ff4a5ac8adb670265f859f1bf03caab3'
          info=json.loads((src/'build-info.json').read_text(encoding='utf-8'))
          assert info['wasm_bytes']==378956
          assert info['wasm_sha256']=='95c7d1e0313567ef099c6e426a7fcee8ff4a5ac8adb670265f859f1bf03caab3'
          assert info['stable_realization_commit']=='c1acf943a7a44ce81080881e59283de8a2019606'
          assert info['quality_closure_commit']=='8248ec5c2c90e39e5b3798205090facc402d2a88'
          assert info['quality_register_entry']=='RETP-2026-071'
          assert not (src/'wasm-loader-b2.js').exists()
          assert not (src/'wasm-b2').exists()
          for p in src.rglob('*.json'):
              json.loads(p.read_text(encoding='utf-8'))
          class P(HTMLParser):
              def __init__(self):
                  super().__init__(); self.ids=[]; self.refs=[]
              def handle_starttag(self, tag, attrs):
                  d=dict(attrs)
                  if 'id' in d: self.ids.append(d['id'])
                  for key in ('href','src'):
                      if key in d: self.refs.append(d[key])
          for h in src.rglob('*.html'):
              parser=P(); parser.feed(h.read_text(encoding='utf-8'))
              assert len(parser.ids)==len(set(parser.ids)), f'id duplicado: {h}'
              for ref in parser.refs:
                  if not ref or ref.startswith(('#','http://','https://','mailto:','data:')):
                      continue
                  target=(h.parent/ref.split('?',1)[0].split('#',1)[0]).resolve()
                  assert target.exists(), f'enlace local ausente: {h} -> {ref}'
          dst=Path(os.environ['RUNNER_TEMP'])/'out'/'SV_LENGUAJE_PRODUCCION_B2_CLOUDFLARE_2026-08-30_FINAL_RECONCILIADO.zip'
          stamp=(2026,8,30,0,0,0)
          with zipfile.ZipFile(dst,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for p in sorted(q for q in src.rglob('*') if q.is_file()):
                  zi=zipfile.ZipInfo(p.relative_to(src).as_posix(),stamp)
                  zi.compress_type=zipfile.ZIP_DEFLATED
                  zi.external_attr=(0o100644 << 16)
                  z.writestr(zi,p.read_bytes(),compress_type=zipfile.ZIP_DEFLATED,compresslevel=9)
          PY

          for js in "$OUT"/*.js; do node --check "$js" >/dev/null; done

          ZIP="$RUNNER_TEMP/out/SV_LENGUAJE_PRODUCCION_B2_CLOUDFLARE_2026-08-30_FINAL_RECONCILIADO.zip"
          unzip -t "$ZIP"
          test "$(zipinfo -1 "$ZIP" | wc -l)" = "39"
          echo "ZIP_BYTES=$(stat -c %s "$ZIP")" >> "$GITHUB_ENV"
          echo "ZIP_SHA256=$(sha256sum "$ZIP" | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "ZIP_FILES=39" >> "$GITHUB_ENV"

      - name: Resumen de identidad
        run: |
          echo "ZIP_BYTES=$ZIP_BYTES"
          echo "ZIP_SHA256=$ZIP_SHA256"
          echo "ZIP_FILES=$ZIP_FILES"

      - uses: actions/upload-artifact@v4
        with:
          name: paquete-final-reconciliado-b2
          path: ${{ runner.temp }}/out/SV_LENGUAJE_PRODUCCION_B2_CLOUDFLARE_2026-08-30_FINAL_RECONCILIADO.zip
          if-no-files-found: error
          compression-level: 0
