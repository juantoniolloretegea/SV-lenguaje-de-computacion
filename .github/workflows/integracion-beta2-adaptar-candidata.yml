          characteristics_es=f'''<div class="experimental-notice"><strong>Estado.</strong> Esta página describe la candidata de producción derivada de Beta B2. Su publicación estable permanece pendiente de autorización de Calidad.</div>
<section class="doc-section"><h2>1. Identidad computacional</h2><p>SVP-ES y SVP-EN son dos perfiles lingüísticos explícitos de una misma realización. Las grafías se resuelven antes del análisis sintáctico y convergen en las mismas identidades internas, el mismo analizador, la misma IR y la misma semántica.</p><ul><li>Perfiles admitidos: <code>es</code> y <code>en</code>.</li><li>No existe autodetección de idioma.</li><li>Cambiar el idioma de la interfaz no cambia el perfil de la fuente.</li><li>Identificadores del usuario, cadenas, comentarios y datos no se traducen.</li></ul></section>
<section class="doc-section"><h2>2. Cobertura lingüística</h2><div class="metric-grid"><div class="metric-card"><strong>154/154</strong><span>identidades del catálogo cubiertas</span></div><div class="metric-card"><strong>147</strong><span>formas realizables</span></div><div class="metric-card"><strong>7</strong><span>formas protegidas no realizables</span></div><div class="metric-card"><strong>19</strong><span>pares válidos ES/EN con carga semántica equivalente</span></div><div class="metric-card"><strong>12/12</strong><span>fuentes EN rechazadas bajo ES</span></div><div class="metric-card"><strong>12/12</strong><span>fuentes ES rechazadas bajo EN</span></div></div></section>
<section class="doc-section"><h2>3. Ensamblaje multifuente</h2><p>La candidata admite dos unidades <code>.svp</code> con perfiles independientes. Cada unidad se analiza bajo su propio perfil; no se concatenan textos ni secuencias léxicas. Las representaciones canónicas se integran y la bienformación global se valida después de la unión.</p><p>Las combinaciones EN+EN, EN+ES, ES+EN y ES+ES fueron admitidas en la batería positiva; perfil incorrecto, identificador global duplicado y sintaxis partida entre archivos fueron rechazados.</p></section>
<section class="doc-section"><h2>4. Regresión de la realización</h2><p>El corpus vigente contiene <strong>79 casos</strong>: 12 válidos y 67 inválidos. La regresión B2 preservó la equivalencia diferencial de R0 sobre los 79 casos, la paridad nativa/WASI/navegador y los diez criterios de R1 dentro de su alcance cerrado.</p><p>El WebAssembly de navegador de esta candidata ocupa <strong>377812 bytes</strong> y tiene SHA-256 <code>03a958e5c24a23aebfab6d68aaa24e40d83085127b7a2bc7d23fd27a27ac6e03</code>.</p></section>
<section class="doc-section"><h2>5. Límites</h2><ul><li>El ensamblaje de dos unidades no constituye todavía una infraestructura general de proyectos o módulos arbitrarios.</li><li>No se ha acreditado paridad textual exacta de todos los diagnósticos entre las realizaciones.</li><li>La seguridad visual Unicode no se declara resuelta.</li><li>Las deudas heredadas del núcleo permanecen gobernadas separadamente por Calidad y no quedan cerradas por esta interfaz.</li></ul><p><a class="inline-link" href="{quality_url}" target="_blank" rel="noopener noreferrer">Acta de Calidad sobre huecos heredados y bloqueo de R2.</a></p></section>'''
          (root/'caracteristicas.html').write_text(page('es','Características','Propiedades verificadas de la candidata bilingüe y de su ensamblaje multifuente.',characteristics_es))

          characteristics_en=f'''<div class="experimental-notice"><strong>Status.</strong> This page describes the production candidate derived from Beta B2. Stable publication remains pending Quality authorization.</div>
<section class="doc-section"><h2>1. Computational identity</h2><p>SVP-ES and SVP-EN are two explicit language profiles of one implementation. Surface spellings are resolved before parsing and converge on the same internal identities, parser, IR and semantics.</p><ul><li>Accepted profiles: <code>es</code> and <code>en</code>.</li><li>There is no language autodetection.</li><li>Changing interface language does not change the source profile.</li><li>User identifiers, strings, comments and data are not translated.</li></ul></section>
<section class="doc-section"><h2>2. Language coverage</h2><div class="metric-grid"><div class="metric-card"><strong>154/154</strong><span>catalog identities covered</span></div><div class="metric-card"><strong>147</strong><span>realizable forms</span></div><div class="metric-card"><strong>7</strong><span>protected non-realizable forms</span></div><div class="metric-card"><strong>19</strong><span>valid ES/EN pairs with equivalent semantic payload</span></div><div class="metric-card"><strong>12/12</strong><span>EN sources rejected under ES</span></div><div class="metric-card"><strong>12/12</strong><span>ES sources rejected under EN</span></div></div></section>
<section class="doc-section"><h2>3. Multi-source assembly</h2><p>The candidate accepts two <code>.svp</code> units with independent profiles. Each unit is parsed under its own profile; text and token streams are never concatenated. Canonical representations are merged and global well-formedness is checked after the merge.</p><p>EN+EN, EN+ES, ES+EN and ES+ES were accepted by the positive suite; wrong profile, duplicate global identifier and syntax split across files were rejected.</p></section>
<section class="doc-section"><h2>4. Implementation regression</h2><p>The current corpus contains <strong>79 cases</strong>: 12 valid and 67 invalid. B2 regression preserved R0 differential equivalence over all 79 cases, native/WASI/browser parity, and the ten R1 criteria within their closed scope.</p><p>The browser WebAssembly for this candidate is <strong>377812 bytes</strong>, SHA-256 <code>03a958e5c24a23aebfab6d68aaa24e40d83085127b7a2bc7d23fd27a27ac6e03</code>.</p></section>
<section class="doc-section"><h2>5. Limits</h2><ul><li>Two-unit assembly is not yet a general project or arbitrary-module infrastructure.</li><li>Exact diagnostic-text parity across implementations has not been established.</li><li>Visual Unicode security is not declared solved.</li><li>Inherited core debts remain separately governed by Quality and are not closed by this interface.</li></ul><p><a class="inline-link" href="{quality_url}" target="_blank" rel="noopener noreferrer">Quality record on inherited gaps and the R2 block.</a></p></section>'''
          (root/'features.html').write_text(page('en','Features','Verified properties of the bilingual production candidate and its multi-source assembly.',characteristics_en))

          metrics_es='''<div class="experimental-notice"><strong>Alcance.</strong> Las cifras siguientes pertenecen a las baterías identificadas y no son constantes universales del Lenguaje.</div>
<section class="doc-section"><h2>1. Rendimiento relativo de B2</h2><p>Frente al candidato 2A, B2 no produjo una regresión atribuible de memoria dinámica ni una penalización específica del perfil español. En la carga completa ensayada, la variación de CPU fue aproximadamente +0,85 % para EN y +0,65 % para ES.</p></section>
<section class="doc-section"><h2>2. Coste estático frente a 2A</h2><div class="doc-table-wrap"><table class="doc-table"><thead><tr><th>Magnitud</th><th>Variación B2</th></tr></thead><tbody><tr><td>Ejecutable nativo</td><td>+1200 B (+0,129 %)</td></tr><tr><td>WebAssembly sin comprimir</td><td>+22591 B (≈ +6,36 %)</td></tr><tr><td>Distribución WebAssembly comprimida</td><td>+4902 B (≈ +5,06 %)</td></tr></tbody></table></div><p>El coste estático es real y se registra separadamente de la memoria dinámica.</p></section>
<section class="doc-section"><h2>3. Línea base R0-8 de la candidata</h2><div class="doc-table-wrap"><table class="doc-table"><tbody><tr><th>Corpus</th><td>12 válidos · 67 inválidos · 79 total</td></tr><tr><th>Mediana por caso válido</th><td>735375 ns</td></tr><tr><th>RSS mediana</th><td>2526 KiB</td></tr><tr><th>Nativo</th><td>928784 B · SHA-256 <code>7078194c14db7b3348d6f4f7f3f3e6e5f94076bef51549285975a3191306095e</code></td></tr><tr><th>WASI</th><td>408204 B · SHA-256 <code>60e5aabe122ed44cc1ba1f1be8494506932b4e70855c5924923bc37ba4213155</code></td></tr><tr><th>WebAssembly navegador</th><td>377812 B · SHA-256 <code>03a958e5c24a23aebfab6d68aaa24e40d83085127b7a2bc7d23fd27a27ac6e03</code></td></tr></tbody></table></div></section>
<section class="doc-section"><h2>4. Paridad</h2><p>La batería R0-8 confirmó admisión/rechazo para 12/12 casos válidos y 67/67 inválidos entre referencia Python, Rust nativo y WASI, y confirmó la misma cobertura en navegador. Esta evidencia no afirma identidad textual exacta de todos los diagnósticos.</p></section>'''
          (root/'programacion-metricas.html').write_text(page('es','Programación y métricas','Medidas de rendimiento, tamaño y paridad correspondientes a la candidata B2.',metrics_es))

          metrics_en='''<div class="experimental-notice"><strong>Scope.</strong> The following figures belong to the identified test suites and are not universal constants of the Language.</div>
<section class="doc-section"><h2>1. B2 relative performance</h2><p>Against candidate 2A, B2 showed no attributable dynamic-memory regression and no Spanish-profile-specific penalty. Under the tested full load, CPU variation was approximately +0.85% for EN and +0.65% for ES.</p></section>
<section class="doc-section"><h2>2. Static cost against 2A</h2><div class="doc-table-wrap"><table class="doc-table"><thead><tr><th>Magnitude</th><th>B2 change</th></tr></thead><tbody><tr><td>Native executable</td><td>+1200 B (+0.129%)</td></tr><tr><td>Uncompressed WebAssembly</td><td>+22591 B (≈ +6.36%)</td></tr><tr><td>Compressed WebAssembly distribution</td><td>+4902 B (≈ +5.06%)</td></tr></tbody></table></div><p>The static cost is real and is recorded separately from dynamic memory.</p></section>
<section class="doc-section"><h2>3. R0-8 candidate baseline</h2><div class="doc-table-wrap"><table class="doc-table"><tbody><tr><th>Corpus</th><td>12 valid · 67 invalid · 79 total</td></tr><tr><th>Median per valid case</th><td>735375 ns</td></tr><tr><th>Median RSS</th><td>2526 KiB</td></tr><tr><th>Native</th><td>928784 B · SHA-256 <code>7078194c14db7b3348d6f4f7f3f3e6e5f94076bef51549285975a3191306095e</code></td></tr><tr><th>WASI</th><td>408204 B · SHA-256 <code>60e5aabe122ed44cc1ba1f1be8494506932b4e70855c5924923bc37ba4213155</code></td></tr><tr><th>Browser WebAssembly</th><td>377812 B · SHA-256 <code>03a958e5c24a23aebfab6d68aaa24e40d83085127b7a2bc7d23fd27a27ac6e03</code></td></tr></tbody></table></div></section>
<section class="doc-section"><h2>4. Parity</h2><p>R0-8 confirmed acceptance/rejection for 12/12 valid and 67/67 invalid cases across the Python reference, native Rust and WASI, and confirmed the same coverage in the browser. This evidence does not claim exact diagnostic-text identity.</p></section>'''
          (root/'programming-metrics.html').write_text(page('en','Programming and metrics','Performance, size and parity measurements for the B2-derived production candidate.',metrics_en))

          security_es=f'''<div class="experimental-notice"><strong>Estado.</strong> Controles verificables de la candidata de producción; no constituyen una certificación general de seguridad.</div>
<section class="doc-section"><h2>1. Identidad y ejecución</h2><p>La compilación y el ensamblaje se ejecutan localmente mediante WebAssembly. El módulo esperado ocupa 377812 bytes y tiene SHA-256 <code>03a958e5c24a23aebfab6d68aaa24e40d83085127b7a2bc7d23fd27a27ac6e03</code>. La interfaz comprueba huella y tamaño antes de instanciarlo.</p></section>
<section class="doc-section"><h2>2. Perfil y aislamiento</h2><ul><li>Selección explícita <code>es</code>/<code>en</code>; sin autodetección.</li><li>El idioma de interfaz no modifica la fuente ni sus perfiles.</li><li>El cambio de perfil no traduce ni altera los bytes del programa.</li><li>El ensamblaje no concatena texto ni secuencias léxicas entre archivos.</li></ul></section>
<section class="doc-section"><h2>3. Controles de interfaz</h2><ul><li>Política de seguridad de contenido restrictiva.</li><li>Límite de 1 MiB por unidad fuente en la interfaz.</li><li>Decodificación UTF-8 de resultados en modo estricto.</li><li>Contraste de SHA-256 de la fuente cuando la compilación devuelve su huella.</li></ul></section>
<section class="doc-section"><h2>4. Límites</h2><ul><li>La seguridad del navegador, del alojamiento y de la cadena externa de entrega queda fuera de la semántica del compilador.</li><li>La seguridad visual Unicode no se declara resuelta.</li><li>Dos unidades no acreditan una infraestructura general de proyectos o módulos arbitrarios.</li><li>Las deudas heredadas del núcleo permanecen abiertas bajo el gobierno de Calidad.</li></ul><p><a class="inline-link" href="{quality_url}" target="_blank" rel="noopener noreferrer">Registro de Calidad aplicable.</a></p></section>'''
          (root/'seguridad-b2.html').write_text(page('es','Seguridad','Controles observables y límites de seguridad de la candidata de producción.',security_es))
          security_en=f'''<div class="experimental-notice"><strong>Status.</strong> Verifiable controls of the production candidate; this is not a general security certification.</div>
<section class="doc-section"><h2>1. Identity and execution</h2><p>Compilation and assembly run locally in WebAssembly. The expected module is 377812 bytes, SHA-256 <code>03a958e5c24a23aebfab6d68aaa24e40d83085127b7a2bc7d23fd27a27ac6e03</code>. The interface checks both digest and size before instantiation.</p></section>
<section class="doc-section"><h2>2. Profile and isolation</h2><ul><li>Explicit <code>es</code>/<code>en</code> selection; no autodetection.</li><li>Interface language does not modify source or profiles.</li><li>Changing profile does not translate or alter program bytes.</li><li>Assembly never concatenates text or token streams across files.</li></ul></section>
<section class="doc-section"><h2>3. Interface controls</h2><ul><li>Restrictive Content Security Policy.</li><li>1 MiB source-unit limit in the interface.</li><li>Strict UTF-8 result decoding.</li><li>Source SHA-256 is checked when compilation returns a digest.</li></ul></section>
<section class="doc-section"><h2>4. Limits</h2><ul><li>Browser, hosting and external delivery-chain security are outside compiler semantics.</li><li>Visual Unicode security is not declared solved.</li><li>Two units do not establish a general project or arbitrary-module infrastructure.</li><li>Inherited core debts remain open under Quality governance.</li></ul><p><a class="inline-link" href="{quality_url}" target="_blank" rel="noopener noreferrer">Applicable Quality record.</a></p></section>'''
          (root/'security-b2.html').write_text(page('en','Security','Observable security controls and limits of the production candidate.',security_en))

          diag_es='''<div class="experimental-notice"><strong>Alcance.</strong> Esta página facilita la consulta de diagnósticos desde la candidata; no redefine el catálogo canónico.</div>
<section class="doc-section"><h2>1. Catálogo aplicable</h2><p>Para Gramática 0.2 e IR 0.3, el catálogo efectivo contiene <strong>50 códigos</strong>. La versión 0.3 conserva el catálogo 0.2 y añade <code>E110</code>, <code>E305</code> y <code>E308</code>.</p></section>
<section class="doc-section"><h2>2. Incorporaciones de v0.3</h2><div class="doc-table-wrap"><table class="doc-table"><thead><tr><th>Código</th><th>Nombre</th><th>Alcance</th></tr></thead><tbody><tr><td><code>E110</code></td><td><code>InvalidAdmissibilitySpec</code></td><td>Contrato de <code>AdmissibilitySpec</code>.</td></tr><tr><td><code>E305</code></td><td><code>UnsafeUResolution</code></td><td>Objetivo U constituido e instancia compatible.</td></tr><tr><td><code>E308</code></td><td><code>FrameClosureViolation</code></td><td>Coherencia relacional y cierre de <code>Frame</code>.</td></tr></tbody></table></div></section>
<section class="doc-section"><h2>3. Separación de capas</h2><p>Los códigos <code>E...</code> pertenecen al compilador. Los mensajes relativos a carga de WebAssembly, tamaño de fuente, UTF-8, huellas o transporte pertenecen a la interfaz y no son diagnósticos semánticos del Lenguaje.</p></section>
<section class="doc-section"><h2>4. Divergencia histórica conservada</h2><p>El catálogo conserva la divergencia histórica de <code>E204</code>: la IR histórica lo identifica como <code>MissingConflictOperator</code>, mientras que el catálogo efectivo de la fase inicial de compilación lo utiliza como <code>QueryMissingContext</code>. La candidata no oculta ni reasigna esta divergencia.</p></section>
<section class="doc-section"><h2>5. Límite probatorio</h2><p>La regresión confirma admisión/rechazo sobre el corpus vigente, pero no acredita identidad textual exacta de todos los diagnósticos entre Python y Rust/WebAssembly.</p></section>'''
          (root/'diagnosticos.html').write_text(page('es','Diagnósticos','Catálogo aplicable, separación de capas y límites de paridad diagnóstica.',diag_es))
          diag_en='''<div class="experimental-notice"><strong>Scope.</strong> This page provides diagnostic access from the candidate and does not redefine the canonical catalog.</div>
<section class="doc-section"><h2>1. Applicable catalog</h2><p>For Grammar 0.2 and IR 0.3, the effective catalog contains <strong>50 codes</strong>. Version 0.3 retains the 0.2 catalog and adds <code>E110</code>, <code>E305</code> and <code>E308</code>.</p></section>
<section class="doc-section"><h2>2. v0.3 additions</h2><div class="doc-table-wrap"><table class="doc-table"><thead><tr><th>Code</th><th>Name</th><th>Scope</th></tr></thead><tbody><tr><td><code>E110</code></td><td><code>InvalidAdmissibilitySpec</code></td><td><code>AdmissibilitySpec</code> contract.</td></tr><tr><td><code>E305</code></td><td><code>UnsafeUResolution</code></td><td>Constituted U target and compatible instance.</td></tr><tr><td><code>E308</code></td><td><code>FrameClosureViolation</code></td><td>Relational coherence and <code>Frame</code> closure.</td></tr></tbody></table></div></section>
<section class="doc-section"><h2>3. Layer separation</h2><p><code>E...</code> codes belong to the compiler. Messages about WebAssembly loading, source size, UTF-8, digests or transport belong to the interface and are not semantic Language diagnostics.</p></section>
<section class="doc-section"><h2>4. Preserved historical divergence</h2><p>The catalog preserves the historical <code>E204</code> divergence: historical IR names it <code>MissingConflictOperator</code>, while the effective early-compilation catalog uses <code>QueryMissingContext</code>. The candidate neither hides nor locally reassigns this divergence.</p></section>
<section class="doc-section"><h2>5. Evidentiary limit</h2><p>Regression confirms acceptance/rejection over the current corpus, but does not establish exact diagnostic-text identity between Python and Rust/WebAssembly.</p></section>'''
          (root/'diagnostics.html').write_text(page('en','Diagnostics','Applicable catalog, layer separation and diagnostic-parity limits.',diag_en))

          # No historial Beta dentro del producto: sólo enlaces a la copia de trazabilidad separada.
          for obsolete in ['historial-beta.html','beta-history.html']:
              p=root/obsolete
              if p.exists(): p.unlink()

          # Comprobaciones documentales antes de crear el commit.
          product='\n'.join(p.read_text(errors='ignore') for p in root.glob('*.html'))
          if 'Beta B1' in product or 'BETA B1' in product: raise SystemExit('persistencia B1 en producto candidato')
          for forbidden in ['experimental · no promovida','experimental · no incorporada','Experimental · no promovida','Experimental · no incorporada','IDE <span>próxima Beta</span>','view-ide']:
              if forbidden in product: raise SystemExit(f'andamiaje Beta persistente: {forbidden}')
          if '?file=GRAMATICA_SUPERFICIAL_MINIMA_SV_v0_2.md' not in index.read_text(): raise SystemExit('enlace profundo de gramática ausente')
          if '?file=IR_CANONICA_BIENFORMACION_SV_v0_3.md' not in index.read_text(): raise SystemExit('enlace profundo de IR ausente')
          if '../beta-publica/historial-beta.html' not in index.read_text(): raise SystemExit('historial Beta no separado')
          print('ADAPTACION_CANDIDATA=PASS')
          PY

      - name: Registrar adaptación sin alterar main ni historial estable
        run: |
          set -euo pipefail
          rm -f .github/workflows/integracion-beta2-adaptar-candidata.yml
          git config user.name "Juan Antonio Lloret Egea"
          git config user.email "111652409+juantoniolloretegea@users.noreply.github.com"
          git add docs/candidata-integracion .github/workflows/integracion-beta2-adaptar-candidata.yml
          git status --short
          git commit -m "integración: adapta Beta 2 como candidata de producción"
          git push origin HEAD:integracion-beta2-candidata-produccion-2026-08-29
