            'href="https://lectura-sv.itvia.online/lenguaje" target="_blank" rel="noopener noreferrer">\n          <strong>IR 0.3</strong>': 'href="https://lectura-sv.itvia.online/lenguaje/?file=IR_CANONICA_BIENFORMACION_SV_v0_3.md" target="_blank" rel="noopener noreferrer">\n          <strong>IR 0.3</strong>',
            '<div><p class="eyebrow">PLAYGROUND</p><h2>Editor SVP</h2>': '<div><p class="eyebrow">ENTORNO DE TRABAJO</p><h2>Editor SVP</h2>',
            '<div><p class="eyebrow">PLAYGROUND · B2</p><h2 data-i18n="assemblyTitle">': '<div><p class="eyebrow">ENTORNO DE TRABAJO</p><h2 data-i18n="assemblyTitle">',
            '<h2 id="build-title" data-i18n="reproducibility">Identidad de Beta B2</h2>': '<h2 id="build-title" data-i18n="reproducibility">Identidad técnica de la candidata</h2>',
            '<dt data-i18n="betaVersion">Beta</dt>': '<dt data-i18n="betaVersion">Procedencia</dt>',
            '<strong data-i18n="betaStateValue">Experimental · no promovida</strong>': '<strong data-i18n="betaStateValue">Candidata de producción · pendiente de autorización de Calidad</strong>',
          }
          for old,new in replacements.items():
              if old not in text:
                  raise SystemExit(f'precondición index ausente: {old[:100]}')
              text = text.replace(old,new,1)

          assurance = re.compile(r'''      <div class="rail-group">\n        <p class="rail-heading">Garantías</p>.*?      </div>\n\n      <div class="rail-group">\n        <p class="rail-heading">Desarrollo</p>.*?      </div>''', re.S)
          new_groups = '''      <div class="rail-group">
        <p class="rail-heading">Documentación</p>
        <a id="diagnostics-link" class="rail-link compact" href="diagnosticos.html" data-i18n="diagnostics">Diagnósticos</a>
        <a id="security-link" class="rail-link compact" href="seguridad-b2.html" data-i18n="security">Seguridad</a>
        <a class="rail-link compact" href="caracteristicas.html" data-i18n="features">Características</a>
        <a id="metrics-link" class="rail-link compact" href="programacion-metricas.html">Programación y métricas</a>
      </div>

      <div class="rail-group">
        <p class="rail-heading">Trazabilidad</p>
        <a id="beta-history-link" class="rail-link compact" href="../beta-publica/historial-beta.html" data-i18n="history">Historial Beta</a>
        <a id="stable-history-link" class="rail-link compact" href="https://lectura-sv.itvia.online/lenguaje/?file=docs/calidad/HISTORIAL_VERSIONES_LENGUAJE_SV.md" target="_blank" rel="noopener noreferrer">Historial de versiones</a>
      </div>'''
          text,n = assurance.subn(new_groups,text,count=1)
          if n != 1: raise SystemExit('no se pudo sustituir navegación Beta/desarrollo')

          ide = re.compile(r'''\n      <section class="workspace-view" id="view-ide" data-workspace-view="ide" hidden>.*?</section>\n''', re.S)
          text,n = ide.subn('\n',text,count=1)
          if n != 1: raise SystemExit('no se pudo retirar vista IDE futura')

          footer = re.compile(r'''  <footer><p data-i18n="footerText">.*?</p></footer>''', re.S)
          new_footer = '''  <footer>
    <p>Lenguaje de computación del Sistema Vectorial SV — .svp (Sistema Vectorial Poligonal) · <a href="https://lectura-sv.itvia.online/lenguaje/?file=docs/calidad/HISTORIAL_VERSIONES_LENGUAJE_SV.md" target="_blank" rel="noopener noreferrer">Historial de versiones</a></p>
    <p>Juan Antonio Lloret Egea · <a href="https://orcid.org/0000-0002-6634-3351" target="_blank" rel="noopener noreferrer">ORCID 0000-0002-6634-3351</a> · ISSN 2695-6411 · CC BY-NC-ND 4.0</p>
  </footer>'''
          text,n = footer.subn(new_footer,text,count=1)
          if n != 1: raise SystemExit('no se pudo adaptar pie')
          index.write_text(text)

          # La lógica de vistas queda limitada a las dos capacidades efectivamente presentes.
          ws = root/'workspace-b2.js'
          w = ws.read_text()
          old='activate(["editor", "assembly", "ide"].includes(requested) ? requested : "editor", false);'
          new='activate(["editor", "assembly"].includes(requested) ? requested : "editor", false);'
          if old not in w: raise SystemExit('precondición workspace IDE ausente')
          ws.write_text(w.replace(old,new,1))

          # Se conservan ABI, memoria y compilación; sólo cambia el vocabulario de estado visible.
          app = root/'app-b2.js'
          a=app.read_text()
          pairs = [
            ('laboratory: "LABORATORIO SV"','laboratory: "LENGUAJE SV"'),
            ('subtitle: "Beta B2 · programación bilingüe y ensamblaje multifuente en navegador."','subtitle: "SVP-ES + SVP-EN · programación bilingüe y ensamblaje multifuente en navegador."'),
            ('stable: "Entorno estable"','stable: "Versión publicada"'),
            ('experimentalTitle: "Entorno experimental."','experimentalTitle: "Candidata de producción."'),
            ('experimentalText: "Beta B2 no constituye por sí sola una versión normativa ni de producción del Lenguaje SV."','experimentalText: "Esta rama es candidata de producción y permanece pendiente de autorización de Calidad y publicación."'),
            ('reproducibility: "Identidad de Beta B2"','reproducibility: "Identidad técnica de la candidata"'),
            ('sourceCut: "Corte fuente soberano"','sourceCut: "Corte fuente de la candidata"'),
            ('betaVersion: "Beta"','betaVersion: "Procedencia"'),
            ('betaStateValue: "Experimental · no promovida"','betaStateValue: "Candidata de producción · pendiente de autorización de Calidad"'),
            ('sourceTooLarge: "La unidad supera el límite de seguridad de 1 MiB de esta interfaz Beta."','sourceTooLarge: "La unidad supera el límite de seguridad de 1 MiB de esta interfaz."'),
            ('wasmReady: "WebAssembly B2 verificado y preparado."','wasmReady: "WebAssembly verificado y preparado."'),
            ('wasmError: "No se pudo inicializar WebAssembly B2"','wasmError: "No se pudo inicializar WebAssembly"'),
            ('footerText: "La interfaz sólo transporta bytes y presenta resultados. La compilación, el ensamblaje canónico y la validación global se ejecutan localmente en el WebAssembly de Beta B2."','footerText: "La interfaz sólo transporta bytes y presenta resultados. La compilación, el ensamblaje canónico y la validación global se ejecutan localmente en WebAssembly."'),
            ('laboratory: "SV LABORATORY"','laboratory: "SV LANGUAGE"'),
            ('subtitle: "Beta B2 · bilingual programming and multi-source assembly in the browser."','subtitle: "SVP-ES + SVP-EN · bilingual programming and multi-source assembly in the browser."'),
            ('stable: "Stable environment"','stable: "Published release"'),
            ('experimentalTitle: "Experimental environment."','experimentalTitle: "Production candidate."'),
            ('experimentalText: "Beta B2 does not by itself constitute a normative or production version of the SV Language."','experimentalText: "This branch is a production candidate pending Quality authorization and publication."'),
            ('reproducibility: "Beta B2 identity"','reproducibility: "Production candidate technical identity"'),
            ('sourceCut: "Sovereign source cut"','sourceCut: "Candidate source cut"'),
            ('betaVersion: "Beta"','betaVersion: "Provenance"'),
            ('betaStateValue: "Experimental · not promoted"','betaStateValue: "Production candidate · pending Quality authorization"'),
            ('sourceTooLarge: "The unit exceeds this Beta interface\'s 1 MiB security limit."','sourceTooLarge: "The unit exceeds this interface\'s 1 MiB security limit."'),
            ('wasmReady: "Beta B2 WebAssembly verified and ready."','wasmReady: "WebAssembly verified and ready."'),
            ('wasmError: "Beta B2 WebAssembly could not be initialized"','wasmError: "WebAssembly could not be initialized"'),
            ('footerText: "The interface only transports bytes and presents results. Compilation, canonical assembly and global validation run locally inside the Beta B2 WebAssembly module."','footerText: "The interface only transports bytes and presents results. Compilation, canonical assembly and global validation run locally in WebAssembly."'),
          ]
          for old,new in pairs:
              if old not in a: raise SystemExit(f'precondición app ausente: {old}')
              a=a.replace(old,new,1)
          app.write_text(a)

          # Capa de traducción estática de la candidata, sin vista IDE ni estado experimental.
          (root/'i18n-static-b2.js').write_text(r'''"use strict";

