name: "Integración Beta 2 — adaptar candidata de producción"

on:
  push:
    branches:
      - integracion-beta2-candidata-produccion-2026-08-29
    paths:
      - .github/workflows/integracion-beta2-adaptar-candidata.yml

permissions:
  contents: write

jobs:
  adaptar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integracion-beta2-candidata-produccion-2026-08-29
          fetch-depth: 0
      - name: Adaptar candidata
        run: python3 tools/integracion_beta2_adaptar_candidata.py
      - name: Registrar resultado y retirar herramientas temporales
        run: |
          set -euo pipefail
          rm -f tools/integracion_beta2_adaptar_candidata.py
          rm -f .github/workflows/integracion-beta2-adaptar-candidata.yml
          git config user.name "Juan Antonio Lloret Egea"
          git config user.email "111652409+juantoniolloretegea@users.noreply.github.com"
          git add -A docs/candidata-integracion tools/integracion_beta2_adaptar_candidata.py .github/workflows/integracion-beta2-adaptar-candidata.yml
          git status --short
          git commit -m "integración: adapta Beta 2 como candidata de producción"
          git push origin HEAD:integracion-beta2-candidata-produccion-2026-08-29
