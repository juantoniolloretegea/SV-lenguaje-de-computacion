name: "Integración Beta 2 — adaptar candidata de producción"

on:
  push:
    branches:
      - integracion-beta2-candidata-produccion-2026-08-29
    paths:
      - .github/workflows/integracion-beta2-adaptar-candidata.yml

permissions:
  contents: write

jobs:
  adaptar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integracion-beta2-candidata-produccion-2026-08-29
          fetch-depth: 0

      - name: Adaptar interfaz y documentación
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          root = Path('docs/candidata-integracion')
          index = root/'index.html'
          text = index.read_text()

          replacements = {
            '<title>SV — Laboratorio del Lenguaje · Beta B2</title>': '<title>Lenguaje de Computación SV — candidata de producción</title>',
            '<p>Beta B2 · SVP-ES + SVP-EN · Rust / WebAssembly</p>': '<p>SVP-ES + SVP-EN · Rust / WebAssembly</p>',
            '<strong>Beta B2 · experimental · no promovida</strong>': '<strong>Candidata de producción · revisión previa a publicación</strong>',
