name: Conformidad SVP

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-24.04
    steps:
      - name: Obtener revisión
        uses: actions/checkout@v4

      - name: Preparar realización nativa identificada
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0
          rustc --version
          cargo --version
          cargo build --manifest-path rust/Cargo.toml -p sv_native

      - name: Verificar sensibilidad del observador de resultados
        run: python3 -m unittest discover -s tests -p 'test_oracle_support.py' -v

      - name: Contrastar los seis paquetes documentales F-IF
        run: |
          node --version
          node --test tests/f_if/sensitivity.mjs
          node tests/f_if/run.mjs

      - name: Verificar contratos de la CLI y testigos SEC-0B
        run: |
          python3 tests/run_cli_smoke.py --rust-bin rust/target/debug/sv-native
          python3 tests/run_sec0_smoke.py --rust-bin rust/target/debug/sv-native

      - name: Verificar fuentes SV frente a oráculos comprometidos
        run: python3 tests/run_conformance.py --rust-bin rust/target/debug/sv-native

      - name: Verificar que la batería conserva el corpus y los esperados
        run: git diff --exit-code -- tests/conformance tests/f_if
