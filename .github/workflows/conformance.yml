name: Conformidad SVP

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener revisión
        uses: actions/checkout@v4

      - name: Comprobar sintaxis Python
        run: python3 -m py_compile src/*.py tests/run_conformance.py

      - name: Verificar que los oráculos detectan las infracciones
        run: python3 -m unittest discover -s tests -p 'test_oracle_support.py' -v

      - name: Verificar relación total CellSpec–OutputSemantics–Codomain
        run: python3 -m unittest discover -s tests -p 'test_output_semantics_totality.py' -v

      - name: Verificar CLI y determinismo literal
        run: |
          python3 tests/run_cli_smoke.py
          python3 tests/run_sec0_smoke.py
          python3 tests/run_e006_characterization.py

      - name: Ejecutar batería contra oráculos comprometidos
        run: python3 tests/run_conformance.py

      - name: Verificar que la batería no modifica los oráculos
        run: git diff --exit-code -- tests/conformance/valid
