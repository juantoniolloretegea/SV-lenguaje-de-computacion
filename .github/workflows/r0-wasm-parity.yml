name: R0 WASM paridad nativa y navegador

on:
  pull_request:
    branches: [main, "fila7-*"]
    paths:
      - "tests/row7_bindings/**"
      - "rust/**"
      - "docs/arquitectura/*R1_6*"
      - "tests/run_conformance.py"
      - "tests/oracle_support.py"
      - "tests/test_oracle_support.py"
      - "tests/run_oracle_sensitivity.py"
      - "tests/r0_wasm_parity.py"
      - "tests/run_wasi_sv_native.js"
      - "tests/r0_wasm_browser_manifest.py"
      - "tests/k1_bridge_cases.py"
      - "tests/k1_horizon_cases.py"
      - "tests/k1_domain_cases.py"
      - "tests/k1_optional_cases.py"
      - "tests/k1_ternarizer_cases.py"
      - "tests/r0_wasm_browser.html"
      - "tests/r0_wasm_browser.js"
      - "tests/conformance/valid/**"
      - "tests/conformance/invalid/**"
      - ".github/workflows/r0-wasm-parity.yml"

permissions:
  contents: read

jobs:
  three-way-parity:
    runs-on: ubuntu-24.04
    steps:
      - name: Obtener revisión
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Fijar Rust 1.98.0 y targets WebAssembly
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0
          rustup target add wasm32-wasip1 --toolchain 1.98.0
          rustup target add wasm32-unknown-unknown --toolchain 1.98.0
          rustc --version
          cargo --version

      - name: Registrar hosts WebAssembly
        run: |
          node --version
          python --version
          uname -a
          git rev-parse HEAD
          git rev-list --parents -n 1 HEAD
          echo "source head: ${{ github.event.pull_request.head.sha }}"
          echo "base head: ${{ github.event.pull_request.base.sha }}"
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then
              "$candidate" --version
              break
            fi
          done

      - name: Probar espacio de trabajo nativo
        run: cargo test --manifest-path rust/Cargo.toml --workspace

      - name: Construir sv-native release nativo
        run: cargo build --manifest-path rust/Cargo.toml --release -p sv_native

      - name: Construir el mismo sv-native para wasm32-wasip1
        run: |
          cargo build --manifest-path rust/Cargo.toml --release -p sv_native --target wasm32-wasip1
          test -f rust/target/wasm32-wasip1/release/sv-native.wasm

      - name: Construir adaptador WebAssembly de navegador
        run: |
          cargo build --manifest-path rust/Cargo.toml --release -p sv_wasm --target wasm32-unknown-unknown
          test -f rust/target/wasm32-unknown-unknown/release/sv_wasm.wasm

      - name: Ejercer paridad complementaria por WASI
        run: |
          mkdir -p artifacts/r0-wasm
          python tests/r0_wasm_parity.py \
            --native-bin rust/target/release/sv-native \
            --wasm-bin rust/target/wasm32-wasip1/release/sv-native.wasm \
            --wasi-runner tests/run_wasi_sv_native.js \
            --report artifacts/r0-wasm/three-way-parity-wasi.json \
            --source-head "${{ github.event.pull_request.head.sha }}" \
            --base-head "${{ github.event.pull_request.base.sha }}"

      - name: Verificar los cinco testigos conservados en WASI
        run: |
          python tests/run_oracle_sensitivity.py \
            --rust-bin rust/target/release/sv-native \
            --wasm-bin rust/target/wasm32-wasip1/release/sv-native.wasm \
            --wasi-runner tests/run_wasi_sv_native.js \
            --output-dir artifacts/r0-wasm/sensitivity

      - name: Verificar BridgeSet, Horizon, Domain, campos opcionales y ensamblaje en nativo y WASI
        run: |
          cargo build --manifest-path rust/Cargo.toml -p sv_native --example assembly_probe --release
          cargo build --manifest-path rust/Cargo.toml -p sv_native --example assembly_probe --release --target wasm32-wasip1
          python tests/k1_bridge_cases.py \
            --native-probe rust/target/release/examples/assembly_probe \
            --wasm-probe rust/target/wasm32-wasip1/release/examples/assembly_probe.wasm \
            --wasi-runner tests/run_wasi_sv_native.js \
            --output-dir artifacts/r0-wasm/bridge-set
          python tests/k1_horizon_cases.py \
            --native-probe rust/target/release/examples/assembly_probe \
            --wasm-probe rust/target/wasm32-wasip1/release/examples/assembly_probe.wasm \
            --wasi-runner tests/run_wasi_sv_native.js \
            --output-dir artifacts/r0-wasm/horizon-types
          python tests/k1_domain_cases.py \
            --native-probe rust/target/release/examples/assembly_probe \
            --wasm-probe rust/target/wasm32-wasip1/release/examples/assembly_probe.wasm \
            --wasi-runner tests/run_wasi_sv_native.js \
            --output-dir artifacts/r0-wasm/domain-names
          python tests/k1_optional_cases.py \
            --native-probe rust/target/release/examples/assembly_probe \
            --wasm-probe rust/target/wasm32-wasip1/release/examples/assembly_probe.wasm \
            --wasi-runner tests/run_wasi_sv_native.js \
            --output-dir artifacts/r0-wasm/optional-fields

      - name: Verificar el límite K1-T en nativo y WASI
        run: |
          python tests/k1_ternarizer_cases.py \
            --native-probe rust/target/release/examples/assembly_probe \
            --wasm-probe rust/target/wasm32-wasip1/release/examples/assembly_probe.wasm \
            --wasi-runner tests/run_wasi_sv_native.js \
            --output-dir artifacts/r0-wasm/ternarizer-boundary

      - name: Comprobar LIG/0.1 en nativo y WASI
        run: |
          mkdir -p artifacts/r0-browser
          cargo build --manifest-path rust/Cargo.toml -p sv_core --example binding_probe --release
          cargo build --manifest-path rust/Cargo.toml -p sv_core --example binding_probe --release --target wasm32-wasip1
          cargo build --manifest-path rust/Cargo.toml -p sv_core --example binding_probe_browser --release --target wasm32-unknown-unknown
          rust/target/release/examples/binding_probe > artifacts/r0-browser/bindings-native.json
          node tests/row7_bindings/run_wasi.mjs rust/target/wasm32-wasip1/release/examples/binding_probe.wasm > artifacts/r0-wasm/bindings-wasi.json
          cmp artifacts/r0-browser/bindings-native.json artifacts/r0-wasm/bindings-wasi.json
          cp rust/target/wasm32-unknown-unknown/release/examples/binding_probe_browser.wasm artifacts/r0-browser/
          sha256sum rust/target/release/examples/binding_probe rust/target/wasm32-wasip1/release/examples/binding_probe.wasm artifacts/r0-browser/binding_probe_browser.wasm > artifacts/r0-wasm/bindings-probes.sha256

      - name: Preparar manifiesto de paridad para navegador
        run: |
          mkdir -p artifacts/r0-browser
          python tests/r0_wasm_browser_manifest.py \
            --native-bin rust/target/release/sv-native \
            --native-probe rust/target/release/examples/assembly_probe \
            --output artifacts/r0-browser/manifest.json \
            --source-head "${{ github.event.pull_request.head.sha }}" \
            --base-head "${{ github.event.pull_request.base.sha }}"
          cp rust/target/wasm32-unknown-unknown/release/sv_wasm.wasm artifacts/r0-browser/sv_wasm.wasm

      - name: Ejercer paridad en navegador real
        run: |
          CHROME=""
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then
              CHROME="$(command -v "$candidate")"
              break
            fi
          done
          if [ -z "$CHROME" ]; then
            echo "No hay navegador Chromium/Chrome disponible en el ejecutor" >&2
            exit 1
          fi
          "$CHROME" --version | tee artifacts/r0-browser/browser-version.txt

          python -m http.server 8765 --bind 127.0.0.1 > artifacts/r0-browser/http-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          READY=0
          for _ in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8765/tests/r0_wasm_browser.html >/dev/null; then
              READY=1
              break
            fi
            sleep 0.25
          done
          if [ "$READY" -ne 1 ]; then
            echo "Servidor HTTP de prueba no disponible" >&2
            exit 1
          fi

          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --virtual-time-budget=30000 \
            --dump-dom \
            http://127.0.0.1:8765/tests/r0_wasm_browser.html \
            > artifacts/r0-browser/browser-parity-dom.html

          grep -q 'data-status="pass"' artifacts/r0-browser/browser-parity-dom.html
          grep -q '"valid_ok":14' artifacts/r0-browser/browser-parity-dom.html
          grep -q '"invalid_ok":106' artifacts/r0-browser/browser-parity-dom.html
          grep -q '"closed_domains_ok":6' artifacts/r0-browser/browser-parity-dom.html
          grep -q '"sensitivity_ok":5' artifacts/r0-browser/browser-parity-dom.html
          grep -q '"bridge_ok":18' artifacts/r0-browser/browser-parity-dom.html
          grep -q '"horizon_ok":20' artifacts/r0-browser/browser-parity-dom.html
          grep -q '"domain_ok":24' artifacts/r0-browser/browser-parity-dom.html
          grep -q '"optional_ok":64' artifacts/r0-browser/browser-parity-dom.html
          grep -q '"ternarizer_ok":40' artifacts/r0-browser/browser-parity-dom.html

      - name: Comprobar LIG/0.1 en navegador real
        run: |
          CHROME=""
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then
              CHROME="$(command -v "$candidate")"
              break
            fi
          done
          test -n "$CHROME"
          python -m http.server 8766 --bind 127.0.0.1 > artifacts/r0-browser/bindings-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8766/tests/row7_bindings/browser.html >/dev/null; then break; fi
            sleep 0.25
          done
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=30000 --dump-dom http://127.0.0.1:8766/tests/row7_bindings/browser.html > artifacts/r0-browser/bindings-browser.html 2> artifacts/r0-browser/bindings-browser.log
          python - <<'PYCODE'
          from pathlib import Path
          from html.parser import HTMLParser
          class Result(HTMLParser):
              active=False
              text=''
              def handle_starttag(self, tag, attrs):
                  if tag=='pre' and dict(attrs).get('id')=='result': self.active=True
              def handle_endtag(self, tag):
                  if tag=='pre': self.active=False
              def handle_data(self, data):
                  if self.active: self.text+=data
          result=Result()
          result.feed(Path('artifacts/r0-browser/bindings-browser.html').read_text())
          expected='CONFORME '+Path('artifacts/r0-browser/bindings-native.json').read_text().removesuffix('\n')
          assert result.text==expected, result.text[:2000]
          print('LIG/0.1: nativo, WASI y navegador con identidad literal de resultados')
          PYCODE

      - name: Registrar identidad de los artefactos
        run: |
          sha256sum rust/target/release/sv-native > artifacts/r0-wasm/sv-native.sha256
          sha256sum rust/target/release/examples/assembly_probe rust/target/wasm32-wasip1/release/examples/assembly_probe.wasm > artifacts/r0-wasm/assembly-probe.sha256
          wc -c rust/target/release/sv-native > artifacts/r0-wasm/sv-native.bytes
          sha256sum rust/target/wasm32-wasip1/release/sv-native.wasm > artifacts/r0-wasm/sv-native-wasi.sha256
          wc -c rust/target/wasm32-wasip1/release/sv-native.wasm > artifacts/r0-wasm/sv-native-wasi.bytes
          sha256sum rust/target/wasm32-unknown-unknown/release/sv_wasm.wasm > artifacts/r0-browser/sv-wasm-browser.sha256
          wc -c rust/target/wasm32-unknown-unknown/release/sv_wasm.wasm > artifacts/r0-browser/sv-wasm-browser.bytes
          git rev-parse HEAD > artifacts/r0-wasm/git-checkout-head.txt
          echo "${{ github.event.pull_request.head.sha }}" > artifacts/r0-wasm/git-source-head.txt
          echo "${{ github.event.pull_request.base.sha }}" > artifacts/r0-wasm/git-base-head.txt
          git rev-list --parents -n 1 HEAD > artifacts/r0-wasm/git-checkout-lineage.txt
          rustc --version > artifacts/r0-wasm/rustc-version.txt
          cargo --version > artifacts/r0-wasm/cargo-version.txt
          node --version > artifacts/r0-wasm/node-version.txt

      - name: Preservar evidencia de paridad
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r0-wasm-three-way-parity
          if-no-files-found: error
          retention-days: 90
          path: |
            artifacts/r0-wasm/
            artifacts/r0-browser/
            rust/target/release/sv-native
            rust/target/release/examples/binding_probe
            rust/target/wasm32-wasip1/release/examples/binding_probe.wasm
            rust/target/release/examples/assembly_probe
            rust/target/wasm32-wasip1/release/examples/assembly_probe.wasm
            rust/target/wasm32-wasip1/release/sv-native.wasm
            rust/target/wasm32-unknown-unknown/release/sv_wasm.wasm
            rust/Cargo.lock
