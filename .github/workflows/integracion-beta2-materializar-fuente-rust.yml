name: Integración Beta 2 — materializar fuente Rust candidata
# Segunda ejecución: archivo fuente completo tras incorporar la parte 02.

on:
  push:
    branches:
      - integracion-beta2-candidata-produccion-2026-08-29
    paths:
      - .github/workflows/integracion-beta2-materializar-fuente-rust.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materializar:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener rama candidata
        uses: actions/checkout@v4
        with:
          ref: integracion-beta2-candidata-produccion-2026-08-29
          fetch-depth: 0

      - name: Reconstruir y verificar archivo fuente exportado
        run: |
          set -euo pipefail
          cat .integracion-beta2-staging/source.part00.b64 \
              .integracion-beta2-staging/source.part01.b64 \
              .integracion-beta2-staging/source.part02.b64 \
              .integracion-beta2-staging/source.part03.b64 > /tmp/b2-source.b64
          base64 --decode /tmp/b2-source.b64 > /tmp/b2-source.tar.gz
          echo "40722dcce6c33fb258096ac6bdb48c9774d37daa14e7f08e7bd86b4af3ffadb8  /tmp/b2-source.tar.gz" | sha256sum -c -
          mkdir /tmp/b2-source
          tar -xzf /tmp/b2-source.tar.gz -C /tmp/b2-source
          echo "b919b3dff9104c60cc527789e30f46a882ee414c3893b15c48055bbd23f44b3b  /tmp/b2-source/rust/sv_core/src/frontend.rs" | sha256sum -c -
          echo "a83064846827affb17df52279aea625dff5c6e0aa753c6c876d7cc4792a31b6e  /tmp/b2-source/rust/sv_core/src/lib.rs" | sha256sum -c -
          echo "c0d4896a867328036aedb5f0b91ae7d04157bb1bf8c77c177ca1d1b81f0ed70a  /tmp/b2-source/rust/sv_native/src/main.rs" | sha256sum -c -
          echo "b5d4e11c3f6260eaee504a98f7d08033493b3591afecb11b766dfc4807cdb608  /tmp/b2-source/rust/sv_wasm/src/lib.rs" | sha256sum -c -
          echo "f21983e2f9053dc00f0384974e9ba922547bca52f5046353403ccbb07eef4f3a  /tmp/b2-source/rust/sv_core/examples/probe_assembly_2b.rs" | sha256sum -c -

      - name: Materializar únicamente la fuente gobernada de B2
        run: |
          set -euo pipefail
          LOCK_BEFORE=$(sha256sum rust/Cargo.lock | awk '{print $1}')
          cp /tmp/b2-source/rust/sv_core/src/frontend.rs rust/sv_core/src/frontend.rs
          cp /tmp/b2-source/rust/sv_core/src/lib.rs rust/sv_core/src/lib.rs
          cp /tmp/b2-source/rust/sv_native/src/main.rs rust/sv_native/src/main.rs
          cp /tmp/b2-source/rust/sv_wasm/src/lib.rs rust/sv_wasm/src/lib.rs
          cp /tmp/b2-source/rust/sv_core/examples/probe_assembly_2b.rs rust/sv_core/examples/probe_assembly_2b.rs
          LOCK_AFTER=$(sha256sum rust/Cargo.lock | awk '{print $1}')
          test "$LOCK_BEFORE" = "$LOCK_AFTER"
          echo "CARGO_LOCK_UNCHANGED=$LOCK_AFTER"

      - name: Validar con el cierre de dependencias soberano
        run: |
          set -euo pipefail
          cargo test --locked --workspace --manifest-path rust/Cargo.toml
          rustup target add wasm32-unknown-unknown
          export CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target-integracion-b2"
          cargo build --locked --release --manifest-path rust/Cargo.toml -p sv_wasm --target wasm32-unknown-unknown
          WASM="$CARGO_TARGET_DIR/wasm32-unknown-unknown/release/sv_wasm.wasm"
          test "$(wc -c < "$WASM" | tr -d ' ')" = "377812"
          test "$(sha256sum "$WASM" | awk '{print $1}')" = "03a958e5c24a23aebfab6d68aaa24e40d83085127b7a2bc7d23fd27a27ac6e03"
          echo "CANDIDATE_RUST_WORKSPACE=PASS"
          echo "CANDIDATE_WASM_IDENTITY=PASS"

      - name: Verificar radio de modificación fuente
        run: |
          set -euo pipefail
          git status --short
          test -z "$(git status --short rust/Cargo.lock)"
          test "$(git status --short rust/sv_core/src/frontend.rs | wc -l)" -eq 1
          test "$(git status --short rust/sv_core/src/lib.rs | wc -l)" -eq 1
          test "$(git status --short rust/sv_native/src/main.rs | wc -l)" -eq 1
          test "$(git status --short rust/sv_wasm/src/lib.rs | wc -l)" -eq 1
          test "$(git status --short rust/sv_core/examples/probe_assembly_2b.rs | wc -l)" -eq 1

      - name: Incorporar fuente y retirar infraestructura temporal
        run: |
          set -euo pipefail
          rm -rf .integracion-beta2-staging
          rm -f .github/workflows/integracion-beta2-materializar-entorno.yml
          rm -f .github/workflows/integracion-beta2-materializar-fuente-rust.yml
          git config user.name "Juan Antonio Lloret Egea"
          git config user.email "111652409+juantoniolloretegea@users.noreply.github.com"
          git add -A
          git commit -m "integración: incorpora fuente Rust B2 verificada al candidato"
          git push origin HEAD:integracion-beta2-candidata-produccion-2026-08-29
