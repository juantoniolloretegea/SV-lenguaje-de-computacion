name: Preparación temporal de distribución B2 corregida

on:
  push:
    branches:
      - fix/cierre-conformidad-b2-20260829
    paths:
      - ".github/workflows/tmp-finalize-b2-distribution.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - name: Obtener rama correctiva
        uses: actions/checkout@v4
        with:
          ref: fix/cierre-conformidad-b2-20260829
          fetch-depth: 0

      - name: Fijar Rust 1.98.0 y WebAssembly
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0
          rustup target add wasm32-unknown-unknown --toolchain 1.98.0
          rustc --version
          cargo --version

      - name: Construir WebAssembly soberano
        run: |
          cargo build --manifest-path rust/Cargo.toml --release -p sv_wasm --target wasm32-unknown-unknown
          WASM=rust/target/wasm32-unknown-unknown/release/sv_wasm.wasm
          test -f "$WASM"
          test "$(wc -c < "$WASM")" = "378956"
          test "$(sha256sum "$WASM" | awk '{print $1}')" = "95c7d1e0313567ef099c6e426a7fcee8ff4a5ac8adb670265f859f1bf03caab3"

      - name: Materializar distribución cerrada
        env:
          OLD_SHA: 03a958e5c24a23aebfab6d68aaa24e40d83085127b7a2bc7d23fd27a27ac6e03
          NEW_SHA: 95c7d1e0313567ef099c6e426a7fcee8ff4a5ac8adb670265f859f1bf03caab3
          OLD_BYTES: "377812"
          NEW_BYTES: "378956"
        run: |
          set -euo pipefail
          WEB=docs/candidata-integracion
          WASM=rust/target/wasm32-unknown-unknown/release/sv_wasm.wasm

          gzip -n -9 -c "$WASM" > /tmp/sv_wasm_b2.wasm.gz
          base64 -w0 /tmp/sv_wasm_b2.wasm.gz > "$WEB/sv_wasm_b2.wasm.gz.b64"

          python - <<'PY'
          from pathlib import Path
          import json

          web = Path('docs/candidata-integracion')
          index = web / 'index.html'
          text = index.read_text(encoding='utf-8')
          text = text.replace('  <script src="wasm-loader-b2.js" defer></script>\n', '')
          index.write_text(text, encoding='utf-8')

          info_path = web / 'build-info.json'
          info = json.loads(info_path.read_text(encoding='utf-8'))
          info['wasm_sha256'] = '95c7d1e0313567ef099c6e426a7fcee8ff4a5ac8adb670265f859f1bf03caab3'
          info['wasm_bytes'] = 378956
          info['wasm_source_head'] = '6c2fcc7f5a771eb0ce89acf959e2ad4ae1874750'
          info['wasm_evidence_run'] = 33271320776
          info['closed_domain_browser_probes'] = 6
          info_path.write_text(json.dumps(info, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          old_sha = '03a958e5c24a23aebfab6d68aaa24e40d83085127b7a2bc7d23fd27a27ac6e03'
          new_sha = '95c7d1e0313567ef099c6e426a7fcee8ff4a5ac8adb670265f859f1bf03caab3'
          roots = [Path('docs/candidata-integracion'), Path('docs/beta-publica')]
          for root in roots:
              for path in root.rglob('*'):
                  if not path.is_file() or path.suffix not in {'.html', '.json', '.js'}:
                      continue
                  data = path.read_text(encoding='utf-8')
                  if old_sha not in data:
                      continue
                  data = data.replace(old_sha, new_sha).replace('377812', '378956')
                  path.write_text(data, encoding='utf-8')
          PY

          rm -f "$WEB/wasm-loader-b2.js"
          rm -rf "$WEB/wasm-b2"

          ACTUAL_BYTES=$(wc -c < "$WASM")
          ACTUAL_SHA=$(sha256sum "$WASM" | awk '{print $1}')
          test "$ACTUAL_BYTES" = "$NEW_BYTES"
          test "$ACTUAL_SHA" = "$NEW_SHA"

          base64 -d "$WEB/sv_wasm_b2.wasm.gz.b64" | gzip -dc > /tmp/reconstructed.wasm
          test "$(wc -c < /tmp/reconstructed.wasm)" = "$NEW_BYTES"
          test "$(sha256sum /tmp/reconstructed.wasm | awk '{print $1}')" = "$NEW_SHA"

          ! grep -R -F "$OLD_SHA" "$WEB" docs/beta-publica
          ! grep -R -F 'wasm-loader-b2.js' "$WEB/index.html"
          test -f "$WEB/sv_wasm_b2.wasm.gz.b64"
          test ! -e "$WEB/wasm-b2"

      - name: Registrar distribución en la rama
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/candidata-integracion docs/beta-publica
          git diff --cached --check
          git commit -m "Cierra la identidad WebAssembly de la distribución B2"
          git push origin HEAD:fix/cierre-conformidad-b2-20260829
