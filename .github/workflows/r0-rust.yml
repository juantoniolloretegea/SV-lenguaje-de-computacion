name: R0 Rust

on:
  pull_request:
    branches: [main, "fila7-*"]
    paths:
      - "tests/row7_bindings/**"
      - "tests/row7_gh/**"
      - "tests/row7_candidate/**"
      - "rust/**"
      - "docs/arquitectura/*R1_6*"
      - "tests/run_conformance.py"
      - "tests/oracle_support.py"
      - "tests/test_oracle_support.py"
      - "tests/run_oracle_sensitivity.py"
      - "tests/run_row7_transitiondata_conformance.py"
      - "tests/run_directed_mutation_sensitivity.py"
      - "tests/row7_transitiondata/**"
      - "tests/conformance/valid/**"
      - "tests/conformance/invalid/**"
      - ".github/workflows/r0-rust.yml"

permissions:
  contents: read

jobs:
  core-native-wasm:
    runs-on: ubuntu-24.04
    steps:
      - name: Obtener revisión
        uses: actions/checkout@v4

      - name: Fijar Rust de referencia
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0
          rustup target add wasm32-unknown-unknown
          rustc --version
          cargo --version

      - name: Verificar codificación contra el testigo independiente
        run: node tests/row7_gh/contract_hash.mjs --referencia

      - name: Probar lectores documentales independientes y preparación Rust
        run: |
          mkdir -p rust/target
          rustc --edition=2021 --test tests/row7_gh/generar_entradas.rs -o rust/target/gh-input-tests
          rust/target/gh-input-tests
          node --test tests/row7_gh/documentary_json.test.mjs

      - name: Contrastar transporte documental G/H sobre LIG/0.1
        run: |
          rustc --edition=2021 tests/row7_gh/generar_entradas.rs -o rust/target/gh-generate
          rust/target/gh-generate --check
          mkdir -p artifacts/gh-lig
          cargo run --manifest-path rust/Cargo.toml -p sv_core --example gh_binding_probe > artifacts/gh-lig/native.json
          node tests/row7_gh/verificar.mjs artifacts/gh-lig/native.json --autoprueba > artifacts/gh-lig/verification.json
          cat artifacts/gh-lig/verification.json

      - name: Preservar contraste documental G/H
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gh-lig-documental
          if-no-files-found: error
          retention-days: 90
          path: artifacts/gh-lig/

      - name: Probar espacio de trabajo nativo
        run: cargo test --manifest-path rust/Cargo.toml --workspace

      - name: Construir la realización nativa del SV
        run: cargo build --manifest-path rust/Cargo.toml -p sv_native

      - name: Verificar conformidad SV frente a resultados esperados fijados
        run: python tests/run_conformance.py --rust-bin rust/target/debug/sv-native

      - name: Verificar conformidad causal del cierre correctivo
        run: |
          python tests/run_row7_transitiondata_conformance.py \
            --rust-bin rust/target/debug/sv-native

      - name: Verificar conservación de testigos y sensibilidad del observador
        run: |
          python tests/run_oracle_sensitivity.py \
            --rust-bin rust/target/debug/sv-native \
            --output-dir artifacts/oracle-sensitivity

      - name: Preservar evidencia del observador
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oracle-sensitivity
          if-no-files-found: error
          retention-days: 90
          path: artifacts/oracle-sensitivity/

      - name: Verificar sensibilidad ante mutaciones dirigidas
        run: |
          python tests/run_directed_mutation_sensitivity.py \
            --output-dir artifacts/directed-mutation-sensitivity

      - name: Preservar evidencia de mutaciones dirigidas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: directed-mutation-sensitivity
          if-no-files-found: error
          retention-days: 90
          path: artifacts/directed-mutation-sensitivity/

      - name: Compilar núcleo para WebAssembly
        run: cargo check --manifest-path rust/Cargo.toml -p sv_core --target wasm32-unknown-unknown

      - name: Compilar adaptador WebAssembly
        run: cargo check --manifest-path rust/Cargo.toml -p sv_wasm --target wasm32-unknown-unknown

  compatibilidad-rust-estable:
    runs-on: ubuntu-24.04
    steps:
      - name: Obtener revisión
        uses: actions/checkout@v4

      - name: Identificar Rust estable disponible
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cargo --version

      - name: Comprobar compatibilidad adicional
        run: cargo test --manifest-path rust/Cargo.toml --workspace
