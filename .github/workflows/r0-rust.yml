name: R0 Rust

on:
  pull_request:
    branches: [main]
    paths:
      - "rust/**"
      - "docs/arquitectura/*R1_6*"
      - "src/**"
      - "tests/r0_7_equivalence.py"
      - "tests/conformance/valid/**"
      - "tests/conformance/invalid/**"
      - ".github/workflows/r0-rust.yml"

permissions:
  contents: read

jobs:
  core-native-wasm:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener revisión
        uses: actions/checkout@v4

      - name: Fijar Rust estable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-unknown-unknown
          rustc --version
          cargo --version

      - name: Probar espacio de trabajo nativo
        run: cargo test --manifest-path rust/Cargo.toml --workspace

      - name: Construir ejecutable nativo R0-7
        run: cargo build --manifest-path rust/Cargo.toml -p sv_native

      - name: Ejercer equivalencia R0-7 sobre el mismo SVP
        run: python tests/r0_7_equivalence.py --rust-bin rust/target/debug/sv-native

      - name: Comprobar núcleo para WebAssembly
        run: cargo check --manifest-path rust/Cargo.toml -p sv_core --target wasm32-unknown-unknown

      - name: Comprobar adaptador WebAssembly
        run: cargo check --manifest-path rust/Cargo.toml -p sv_wasm --target wasm32-unknown-unknown

